name: Release

# Push a tag like v0.2.0 to publish a release. The tag must match
# ZestVersion.current in Sources/ZestCore/Version.swift. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Check the version
        run: |
          version=$(sed -n 's/.*current = "\(.*\)".*/\1/p' Sources/ZestCore/Version.swift)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version.swift ($version)" >&2
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## / { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section '## $version'" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Test
        run: swift test

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.ZEST_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.ZEST_SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/zest.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/zest.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/zest.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # codesign on the runner only finds identities in keychains on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The self-signed certificate is listed as "1) <SHA-1> "zest release signing" (…NOT_TRUSTED)".
          identity=$(security find-identity -p codesigning "$keychain" | awk '/ 1\) / {print $2; exit}')
          if [ -z "$identity" ]; then echo "No signing identity in the keychain" >&2; exit 1; fi
          rm "$RUNNER_TEMP/zest.p12"
          echo "ZEST_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "ZEST_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/build-app.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Zest.zip dist/Zest.zip.sha256 \
            --title "zest ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
