# Imported from a Fig spec. You can edit this file; see docs/adding-a-command.md.
name: gemini
subcommands:
  - name: mcp
    description: Manage MCP servers
    subcommands:
      - name: add
        description: Add a server
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name:
              - -s
              - --scope
            description: 'Configuration scope (user or project)  [string] [choices: "user", "project"] [default: "project"]'
          - name:
              - -t
              - --transport
              - --type
            description: 'Transport type (stdio, sse, http)  [string] [choices: "stdio", "sse", "http"] [default: "stdio"]'
          - name:
              - -e
              - --env
            description: Set environment variables (e.g. -e KEY=value)  [array]
          - name:
              - -H
              - --header
            description: 'Set HTTP headers for SSE and HTTP transports (e.g. -H "X-Api-Key: abc123" -H "Authorization: Bearer abc123")  [array]'
          - name: --timeout
            description: Set connection timeout in milliseconds  [number]
          - name: --trust
            description: Trust the server (bypass all tool call confirmation prompts)  [boolean]
          - name: --description
            description: Set the description for the server  [string]
          - name: --include-tools
            description: A comma-separated list of tools to include  [array]
          - name: --exclude-tools
            description: A comma-separated list of tools to exclude  [array]
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          - name: name
          - name: commandOrUrl
          - name: args
            isOptional: true
            isVariadic: true
      - name: remove
        description: Remove a server
        args:
          name: name
      - name: list
        description: List all configured MCP servers
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
      - name: enable
        description: Enable an MCP server
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --session
            description: "Clear session-only disable  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          name: name
      - name: disable
        description: Disable an MCP server
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --session
            description: "Disable for current session only  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          name: name
    options:
      - name:
          - -d
          - --debug
        description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
      - name:
          - -h
          - --help
        description: Show help  [boolean]
  - name: extensions
    description: "Manage Gemini CLI extensions.  [aliases: extension]"
    subcommands:
      - name: install
        description: Installs an extension from a git repository URL or a local path.
        args:
          - name: source
          - name: --auto-update
            isOptional: true
          - name: --pre-release
            isOptional: true
      - name: uninstall
        description: Uninstalls one or more extensions.
        args:
          name: names
          isOptional: true
      - name: list
        description: Lists installed extensions.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name:
              - -o
              - --output-format
            description: 'The format of the CLI output.  [string] [choices: "text", "json"] [default: "text"]'
          - name:
              - -h
              - --help
            description: Show help  [boolean]
      - name: update
        description: Updates all extensions or a named extension to the latest version.
        args:
          - name: <name
            isOptional: true
          - name: --all
            isOptional: true
      - name: disable
        description: Disables an extension.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --scope
            description: 'The scope to disable the extension in.  [string] [default: "User"]'
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          - name: --scope
            isOptional: true
          - name: name
      - name: enable
        description: Enables an extension.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --scope
            description: The scope to enable the extension in. If not set, will be enabled in all scopes.  [string]
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          - name: --scope
            isOptional: true
          - name: name
      - name: link
        description: Links an extension from a local path. Updates made to the local path will always be reflected.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --consent
            description: "Acknowledge the security risks of installing an extension and skip the confirmation prompt.  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          name: path
      - name: new
        description: Create a new extension from a boilerplate example.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          - name: path
          - name: template
            isOptional: true
      - name: validate
        description: Validates an extension from a local path.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          name: path
      - name: config
        description: Configure extension settings.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --scope
            description: 'The scope to set the setting in.  [string] [choices: "user", "workspace"] [default: "user"]'
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          - name: name
            isOptional: true
          - name: setting
            isOptional: true
    options:
      - name:
          - -d
          - --debug
        description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
      - name:
          - -h
          - --help
        description: Show help  [boolean]
  - name: skills
    description: "Manage agent skills.  [aliases: skill]"
    subcommands:
      - name: list
        description: Lists discovered agent skills.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --all
            description: "Show all skills, including built-in ones.  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          name: --all
          isOptional: true
      - name: enable
        description: Enables an agent skill.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          name: name
      - name: disable
        description: Disables an agent skill.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name:
              - -s
              - --scope
            description: 'The scope to disable the skill in (user or workspace).  [string] [choices: "user", "workspace"] [default: "workspace"]'
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          - name: name
          - name: --scope
            isOptional: true
      - name: install
        description: Installs an agent skill from a git repository URL or a local path.
        args:
          - name: source
          - name: --scope
            isOptional: true
          - name: --path
            isOptional: true
      - name: link
        description: Links an agent skill from a local path. Updates to the source will be reflected immediately.
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --scope
            description: 'The scope to link the skill into. Defaults to "user" (global).  [choices: "user", "workspace"] [default: "user"]'
          - name: --consent
            description: "Acknowledge the security risks of linking a skill and skip the confirmation prompt.  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
        args:
          name: path
      - name: uninstall
        description: Uninstalls an agent skill by name.
        args:
          - name: name
          - name: --scope
            isOptional: true
    options:
      - name:
          - -d
          - --debug
        description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
      - name:
          - -h
          - --help
        description: Show help  [boolean]
  - name: hooks
    description: "Manage Gemini CLI hooks.  [aliases: hook]"
    subcommands:
      - name: migrate
        description: Migrate hooks from Claude Code to Gemini CLI
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --from-claude
            description: "Migrate from Claude Code hooks  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
    options:
      - name:
          - -d
          - --debug
        description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
      - name:
          - -h
          - --help
        description: Show help  [boolean]
  - name: gemma
    description: Manage local Gemma model routing
    subcommands:
      - name: setup
        description: Download and configure Gemma local model routing
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --port
            description: "Port for the LiteRT server  [number] [default: 9379]"
          - name: --skip-model
            description: "Skip model download (binary only)  [boolean] [default: false]"
          - name: --start
            description: "Start the server after setup  [boolean] [default: true]"
          - name: --force
            description: "Re-download binary and model even if already present  [boolean] [default: false]"
          - name: --consent
            description: "Skip interactive consent prompt (implies acceptance)  [boolean] [default: false]"
          - name:
              - -h
              - --help
            description: Show help  [boolean]
      - name: start
        description: Start the LiteRT-LM server
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --port
            description: Port for the LiteRT server  [number]
          - name:
              - -h
              - --help
            description: Show help  [boolean]
      - name: stop
        description: Stop the LiteRT-LM server
      - name: status
        description: Check Gemma local model routing status
        options:
          - name:
              - -d
              - --debug
            description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
          - name: --port
            description: Port to check for the LiteRT server  [number]
          - name:
              - -h
              - --help
            description: Show help  [boolean]
      - name: logs
        description: View LiteRT-LM server logs
    options:
      - name:
          - -d
          - --debug
        description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
      - name:
          - -h
          - --help
        description: Show help  [boolean]
options:
  - name:
      - -d
      - --debug
    description: "Run in debug mode (open debug console with F12)  [boolean] [default: false]"
  - name:
      - -m
      - --model
    description: Model  [string]
  - name:
      - -p
      - --prompt
    description: Run in non-interactive (headless) mode with the given prompt. Appended to input on stdin (if any).  [string]
  - name:
      - -i
      - --prompt-interactive
    description: Execute the provided prompt and continue in interactive mode  [string]
  - name: --skip-trust
    description: "Trust the current workspace for this session.  [boolean] [default: false]"
  - name:
      - -w
      - --worktree
    description: Start Gemini in a new git worktree. If no name is provided, one is generated automatically.  [string]
  - name:
      - -s
      - --sandbox
    description: Run in sandbox?  [boolean]
  - name:
      - -y
      - --yolo
    description: "Automatically accept all actions (aka YOLO mode, see https://www.youtube.com/watch?v=xvFZjo5PgG0 for more details)?  [boolean] [default: false]"
  - name: --approval-mode
    description: 'Set the approval mode: default (prompt for approval), auto_edit (auto-approve edit tools), yolo (auto-approve all tools), plan (read-only mode)  [string] [choices: "default", "auto_edit", "yolo", "plan"]'
  - name: --policy
    description: Additional policy files or directories to load (comma-separated or multiple --policy)  [array]
  - name: --admin-policy
    description: Additional admin policy files or directories to load (comma-separated or multiple --admin-policy)  [array]
  - name: --acp
    description: Starts the agent in ACP mode  [boolean]
  - name: --experimental-acp
    description: Starts the agent in ACP mode (deprecated, use --acp instead)  [boolean]
  - name: --allowed-mcp-server-names
    description: Allowed MCP server names  [array]
  - name: --allowed-tools
    description: "[DEPRECATED: Use Policy Engine instead See https://geminicli.com/docs/core/policy-engine] Tools that are allowed to run without confirmation  [array]"
  - name:
      - -e
      - --extensions
    description: A list of extensions to use. If not provided, all extensions are used.  [array]
  - name:
      - -l
      - --list-extensions
    description: List all available extensions and exit.  [boolean]
  - name:
      - -r
      - --resume
    description: Resume a previous session. Use "latest" for most recent or index number (e.g. --resume 5)  [string]
  - name: --session-file
    description: Load a session from a JSON file  [string]
  - name: --session-id
    description: Start a new session with a manually provided UUID.  [string]
  - name: --list-sessions
    description: List available sessions for the current project and exit.  [boolean]
  - name: --delete-session
    description: Delete a session by index number (use --list-sessions to see available sessions).  [string]
  - name: --include-directories
    description: Additional directories to include in the workspace (comma-separated or multiple --include-directories)  [array]
  - name: --screen-reader
    description: Enable screen reader mode for accessibility.  [boolean]
  - name:
      - -o
      - --output-format
    description: 'The format of the CLI output.  [string] [choices: "text", "json", "stream-json"]'
  - name: --raw-output
    description: "Disable sanitization of model output (e.g. allow ANSI escape sequences). WARNING: This can be a security risk if the model output is untrusted.  [boolean]"
  - name: --accept-raw-output-risk
    description: Suppress the security warning when using --raw-output.  [boolean]
  - name:
      - -v
      - --version
    description: Show version number  [boolean]
  - name:
      - -h
      - --help
    description: Show help  [boolean]
args:
  name: args
  isOptional: true
  isVariadic: true
