# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: "n"
description: Node version management
subcommands:
  - name:
      - i
      - install
    description: Install a Node.js version
    args:
      name: version
      isOptional: false
      suggestions:
        - name:
            - latest
            - current
          description: Newest official release
        - name: lts
          description: Newest Long Term Support official release
        - name: auto
          description: "Read version from file: .n-node-version, .node-version, .nvmrc, or package.json"
        - name: engine
          description: Read version from package.json
      generators:
        script:
          - "n"
          - lsr
          - --all
        js:
          postProcess: 0
  - name:
      - rm
      - –
    description: Remove a Node.js version
    args:
      name: version
      isOptional: false
      isVariadic: true
      suggestions:
        - name:
            - latest
            - current
          description: Newest official release
        - name: lts
          description: Newest Long Term Support official release
        - name: auto
          description: "Read version from file: .n-node-version, .node-version, .nvmrc, or package.json"
        - name: engine
          description: Read version from package.json
      generators:
        script:
          - "n"
          - lsr
          - --all
        js:
          postProcess: 0
  - name: prune
    description: Remove all cached Node.js versions except the installed version
  - name: doctor
    description: Display diagnostics to help resolve problems
  - name: uninstall
    description: Remove the installed Node.js
  - name:
      - ls
      - list
    description: Output downloaded versions
  - name:
      - lsr
      - ls-remote
      - list-remote
    description: Output matching versions available for download
    options:
      - name: --all
        description: Ls-remote displays all matches instead of last 20
    args:
      name: version
      isOptional: false
      suggestions:
        - name:
            - latest
            - current
          description: Newest official release
        - name: lts
          description: Newest Long Term Support official release
        - name: auto
          description: "Read version from file: .n-node-version, .node-version, .nvmrc, or package.json"
        - name: engine
          description: Read version from package.json
      generators:
        script:
          - "n"
          - lsr
          - --all
        js:
          postProcess: 0
  - name:
      - which
      - bin
    description: Output path for downloaded node version
    args:
      name: version
      isOptional: false
      suggestions:
        - name:
            - latest
            - current
          description: Newest official release
        - name: lts
          description: Newest Long Term Support official release
        - name: auto
          description: "Read version from file: .n-node-version, .node-version, .nvmrc, or package.json"
        - name: engine
          description: Read version from package.json
      generators:
        script:
          - "n"
          - lsr
          - --all
        js:
          postProcess: 0
  - name:
      - run
      - use
      - as
    description: Execute downloaded Node.js version with args
    options:
      - name:
          - -e
          - --eval=...
        description: Evaluate script
        insertValue: -e '{cursor}'
        args: {}
      - name: --watch
        description: Watch input files
      - name: --watch-path
        description: Specify a watch directory or file
        args:
          name: path
          template: filepaths
        isRepeatable: true
      - name: --watch-preserve-output
        description: Disable the clearing of the console when watch mode restarts the process
        dependsOn:
          - --watch
          - --watch-path
      - name: --env-file
        description: Specify a file containing environment variables
        args:
          name: path
          template: filepaths
        isRepeatable: true
      - name:
          - -p
          - --print
        description: Evaluate script and print result
      - name:
          - -c
          - --check
        description: Syntax check script without executing
      - name:
          - -v
          - --version
        description: Print Node.js version
      - name:
          - -i
          - --interactive
        description: Always enter the REPL even if stdin does not appear to be a terminal
      - name:
          - -h
          - --help
        description: Print node command line options (currently set)
      - name: --inspect
        description: "Activate inspector on host:port (default: 127.0.0.1:9229)"
        args:
          name: "[host:]port"
          isOptional: true
        requiresSeparator: true
      - name: --preserve-symlinks
        description: Follows symlinks to directories when examining source code and templates for translation strings
    args:
      - name: version
        isOptional: false
        suggestions:
          - name:
              - latest
              - current
            description: Newest official release
          - name: lts
            description: Newest Long Term Support official release
          - name: auto
            description: "Read version from file: .n-node-version, .node-version, .nvmrc, or package.json"
          - name: engine
            description: Read version from package.json
        generators:
          script:
            - "n"
            - lsr
            - --all
          js:
            postProcess: 0
      - name: node script
        isScript: true
        generators:
          template: filepaths
          filter:
            extensions:
              - mjs
              - js
              - cjs
  - name: exec
    description: Execute command with modified PATH, so downloaded node version and npm first
    args:
      - name: version
        isOptional: false
        suggestions:
          - name:
              - latest
              - current
            description: Newest official release
          - name: lts
            description: Newest Long Term Support official release
          - name: auto
            description: "Read version from file: .n-node-version, .node-version, .nvmrc, or package.json"
          - name: engine
            description: Read version from package.json
        generators:
          script:
            - "n"
            - lsr
            - --all
          js:
            postProcess: 0
      - name: cmd
        isCommand: true
      - name: args
        isVariadic: true
options:
  - name:
      - -V
      - --version
    description: Output version of n
  - name:
      - -h
      - --help
    description: Display help information
  - name:
      - -p
      - --preserve
    description: Preserve npm and npx during install of Node.js
  - name: --no-preserve
    description: Do not preserve npm and npx during install of Node.js
  - name:
      - -q
      - --quiet
    description: Disable curl output. Disable log messages processing "auto" and "engine" labels
  - name:
      - -d
      - --download
    description: Download only
  - name:
      - -a
      - --arch
    description: Override system architecture
    args:
      name: Architecture
      suggestions:
        - name:
            - x64
            - x86_64
        - name:
            - arm64
            - aarch64
            - armv8l
        - name:
            - x86
            - i386
            - i686
        - name:
            - armv6l
            - armv7l
  - name: --insecure
    description: Turn off certificate checking for https requests (may be needed from behind a proxy server)
  - name: --use-xz
    description: Override automatic detection of xz support and enable use of xz compressed node downloads
    exclusiveOn:
      - --no-use-xz
  - name: --no-use-xz
    description: Override automatic detection of xz support and disable use of xz compressed node downloads
    exclusiveOn:
      - --use-xz
args:
  name: version
  isOptional: true
  suggestions:
    - name:
        - latest
        - current
      description: Newest official release
    - name: lts
      description: Newest Long Term Support official release
    - name: auto
      description: "Read version from file: .n-node-version, .node-version, .nvmrc, or package.json"
    - name: engine
      description: Read version from package.json
  generators:
    script:
      - "n"
      - lsr
      - --all
    js:
      postProcess: 0
