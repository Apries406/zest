name: secrets
description: Manage secrets on Google Cloud
subcommands:
  - name: add-iam-policy-binding
    description: Add IAM policy binding to a secret
    options:
      - name: --account
        description: Google Cloud Platform user account to use for invocation. Overrides the default *core/account* property value for this command invocation
        args:
          name: ACCOUNT
          description: String
      - name: --billing-project
        description: The Google Cloud Platform project that will be charged quota for operations performed in gcloud. If you need to operate on one project, but need quota against a different project, you can use this flag to specify the billing project. If both `billing/quota_project` and `--billing-project` are specified, `--billing-project` takes precedence. Run `$ gcloud config set --help` to see more information about `billing/quota_project`
        args:
          name: BILLING_PROJECT
          description: String
      - name: --condition
        description: |-
          +
          The condition of the binding to be added. When the condition is explicitly
          specified as `None` (`--condition=None`), a binding without a condition is
          added. When the condition is specified and is not `None`, `--role`
          cannot be a primitive role. Primitive roles are `roles/editor`, `roles/owner`,
          and `roles/viewer`.
          +
          *expression*::: (Required) Expression of the condition which
          evaluates to True or False. This uses a subset of Common Expression
          Language syntax.
          +
          *title*::: (Required) A short string describing the purpose of the expression.
          +
          *description*::: (Optional) Additional description for the expression.
          +
          NOTE: An unsatisfied condition will not allow access via this
          binding
        args:
          name: KEY=VALUE
          description: Dict
      - name: --condition-from-file
        description: |-
          Path to a local JSON or YAML file that defines the condition.
          To see available fields, see the help for `--condition`
        args:
          name: CONDITION_FROM_FILE
          description: Googlecloudsdk.calliope.arg_parsers:FileContents
      - name: --configuration
        description: |-
          The configuration to use for this command invocation. For more
          information on how to use configurations, run:
          `gcloud topic configurations`.  You can also use the CLOUDSDK_ACTIVE_CONFIG_NAME environment
          variable to set the equivalent of this flag for a terminal
          session
        args:
          name: CONFIGURATION
          description: String
      - name: --flags-file
        description: |-
          A YAML or JSON file that specifies a *--flag*:*value* dictionary.
          Useful for specifying complex flag values with special characters
          that work with any command interpreter. Additionally, each
          *--flags-file* arg is replaced by its constituent flags. See
          $ gcloud topic flags-file for more information
        args:
          name: YAML_FILE
          description: String
      - name: --flatten
        description: |-
          Flatten _name_[] output resource slices in _KEY_ into separate records
          for each item in each slice. Multiple keys and slices may be specified.
          This also flattens keys for *--format* and *--filter*. For example,
          *--flatten=abc.def* flattens *abc.def[].ghi* references to
          *abc.def.ghi*. A resource record containing *abc.def[]* with N elements
          will expand to N records in the flattened output. This flag interacts
          with other flags that are applied in this order: *--flatten*,
          *--sort-by*, *--filter*, *--limit*
        args:
          name: KEY
          description: List
      - name: --format
        description: |-
          Set the format for printing command output resources. The default is a
          command-specific human-friendly output format. The supported formats
          are: `config`, `csv`, `default`, `diff`, `disable`, `flattened`, `get`, `json`, `list`, `multi`, `none`, `object`, `table`, `text`, `value`, `yaml`. For more details run $ gcloud topic formats
        args:
          name: FORMAT
          description: String
      - name: --help
        description: Display detailed help
      - name: --impersonate-service-account
        description: For this gcloud invocation, all API requests will be made as the given service account instead of the currently selected account. This is done without needing to create, download, and activate a key for the account. In order to perform operations as the service account, your currently selected account must have an IAM role that includes the iam.serviceAccounts.getAccessToken permission for the service account. The roles/iam.serviceAccountTokenCreator role has this permission or you may create a custom role. Overrides the default *auth/impersonate_service_account* property value for this command invocation
        args:
          name: SERVICE_ACCOUNT_EMAIL
          description: String
      - name: --log-http
        description: Log all HTTP server requests and responses to stderr. Overrides the default *core/log_http* property value for this command invocation
      - name: --member
        description: |-
          The member to add the binding for. Should be of the form `user|group|serviceAccount:email` or
          `domain:domain`.
          +
          Examples: `user:test-user@gmail.com`, `group:admins@example.com`,
          `serviceAccount:test123@example.domain.com`, or
          `domain:example.domain.com`.
          +
          Can also be one of the following special values:
          * `allUsers` - Special identifier that represents anyone who is on the internet,
             with or without a Google account.
          * `allAuthenticatedUsers` - Special identifier that represents anyone who is
             authenticated with a Google account or a service account
        priority: 100
        args:
          name: MEMBER
          description: String
      - name: --project
        description: |-
          The Google Cloud Platform project ID to use for this invocation. If
          omitted, then the current project is assumed; the current project can
          be listed using `gcloud config list --format='text(core.project)'`
          and can be set using `gcloud config set project PROJECTID`.
          +
          `--project` and its fallback `core/project` property play two roles
          in the invocation. It specifies the project of the resource to
          operate on. It also specifies the project for API enablement check,
          quota, and billing. To specify a different project for quota and
          billing, use `--billing-project` or `billing/quota_project` property
        args:
          name: PROJECT_ID
          description: String
      - name: --quiet
        description: |-
          Disable all interactive prompts when running gcloud commands. If input
          is required, defaults will be used, or an error will be raised.
          Overrides the default core/disable_prompts property value for this
          command invocation. This is equivalent to setting the environment
          variable `CLOUDSDK_CORE_DISABLE_PROMPTS` to 1
      - name: --role
        description: Define the role of the member
        priority: 100
        args:
          name: ROLE
          description: String
      - name: --trace-token
        description: Token used to route traces of service requests for investigation of issues. Overrides the default *core/trace_token* property value for this command invocation
        args:
          name: TRACE_TOKEN
          description: String
      - name: --user-output-enabled
        description: Print user intended output to the console. Overrides the default *core/user_output_enabled* property value for this command invocation. Use *--no-user-output-enabled* to disable
      - name: --verbosity
        description: "Override the default verbosity for this command. Overrides the default *core/verbosity* property value for this command invocation. _VERBOSITY_ must be one of: *debug*, *info*, *warning*, *error*, *critical*, *none*"
        args:
          name: VERBOSITY
          description: String
          suggestions:
            - debug
            - info
            - warning
            - error
            - critical
            - none
    args:
      name: SECRET
      description: ID of the secret or fully qualified identifier for the secret
