# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: esbuild
description: An extremely fast JavaScript bundler
icon: data:image/png;base64,
options:
  - name: --bundle
    description: Bundle all dependencies into the output files
    icon: data:image/png;base64,
    priority: 51
  - name: --define
    description: Replace variable names with a literal value, eg. --define:DEBUG=true
    icon: data:image/png;base64,
    priority: 51
    args:
      name: name=value
    requiresSeparator: ":"
  - name: --external
    description: Exclude modules from the build
    icon: data:image/png;base64,
    priority: 51
    args:
      name: module specifier
    requiresSeparator: ":"
  - name: --format
    description: The output format
    icon: data:image/png;base64,
    priority: 51
    args:
      name: format
      suggestions:
        - iife
        - cjs
        - esm
    requiresSeparator: =
  - name: --loader
    description: For a given file extension, specify a loader
    icon: data:image/png;base64,
    priority: 51
    args:
      name: loaders
      generators:
        js:
          custom: 2
          trigger: 0
          getQueryTerm: 1
    requiresSeparator: ":"
  - name: --minify
    description: Minify the output (sets all the --minify-* options)
    icon: data:image/png;base64,
    priority: 51
  - name: --outdir
    description: The output directory for multiple entrypoints
    icon: data:image/png;base64,
    priority: 51
    args:
      name: path
      template: folders
    requiresSeparator: =
  - name: --outfile
    description: The output file for one entrypoint
    icon: data:image/png;base64,
    priority: 51
    args:
      name: path
      template: filepaths
    requiresSeparator: =
  - name: --platform
    description: The platform target
    icon: data:image/png;base64,
    priority: 51
    args:
      name: name
      suggestions:
        - browser
        - node
        - neutral
    requiresSeparator: =
  - name: --serve
    description: Start a local HTTP server on this host:port
    icon: data:image/png;base64,
    priority: 51
    args:
      name: "[address:]port"
      isOptional: true
    requiresSeparator: =
  - name: --splitting
    description: Enable code splitting
    icon: data:image/png;base64,
    priority: 51
  - name: --target
    description: Set the environment target. Can be a particular ES version or browser version, eg. chrome101
    icon: data:image/png;base64,
    priority: 51
    args:
      name: target
      generators:
        js:
          custom: 5
          trigger: 3
          getQueryTerm: 4
    requiresSeparator: =
  - name: --watch
    description: Rebuild on file system changes
    icon: data:image/png;base64,
    priority: 51
    args:
      name: forever
      isOptional: true
      suggestions:
        - forever
    requiresSeparator: =
  - name: --allow-overwrite
    description: Allow output files to overwrite input files
    icon: data:image/png;base64,
  - name: --analyze
    description: Print a report about the contents of the bundle
    icon: data:image/png;base64,
    args:
      name: verbose
      isOptional: true
      suggestions:
        - verbose
    requiresSeparator: =
  - name: --asset-names
    description: Path template for 'file' loader files
    icon: data:image/png;base64,
    args:
      name: template
      default: "[name]-[hash]"
    requiresSeparator: =
  - name: --banner
    description: Text to be prepended to each output file type
    icon: data:image/png;base64,
    args:
      name: ext=text[,ext=text...]
      generators:
        js:
          custom: 8
          trigger: 6
          getQueryTerm: 7
    requiresSeparator: ":"
  - name: --charset
    displayName: --charset=utf8
    description: Use UTF-8 instead of escaped codepoints in ASCII
    icon: data:image/png;base64,
    insertValue: --charset=utf8
    args: {}
    requiresSeparator: =
  - name: --chunk-names
    description: Path template to use for code splitting chunks
    icon: data:image/png;base64,
    args:
      name: template
      default: "[name]-[hash]"
    requiresSeparator: =
  - name: --color
    description: Force use of terminal colors
    icon: data:image/png;base64,
    args:
      name: enabled
      suggestions:
        - "true"
        - "false"
    requiresSeparator: =
  - name: --drop
    description: Remove certain constructs
    icon: data:image/png;base64,
    args:
      suggestions:
        - console
        - debugger
    requiresSeparator: ":"
  - name: --entry-names
    description: Path template to use for entry point output paths
    icon: data:image/png;base64,
    args:
      name: template
      default: "[dir]/[name]"
    requiresSeparator: =
  - name: --footer
    description: Text to be appended to each file type
    icon: data:image/png;base64,
    args:
      name: ext=text
      generators:
        js:
          custom: 11
          trigger: 9
          getQueryTerm: 10
    requiresSeparator: ":"
  - name: --global-name
    description: The name of the global if using --format=iife
    icon: data:image/png;base64,
    args:
      name: name
    requiresSeparator: =
  - name: --ignore-annotations
    description: Enable this to work with packages that have incorrect tree-shaking annotations
    icon: data:image/png;base64,
  - name: --inject
    description: Import the file into all input files, automatically replace matching globals
    icon: data:image/png;base64,
    args:
      name: import
      template: filepaths
    requiresSeparator: ":"
  - name: --jsx-factory
    description: What to use for the JSX factory
    icon: data:image/png;base64,
    args:
      name: factory
      suggestions:
        - React.createElement
        - h
        - preact.h
    requiresSeparator: =
  - name: --jsx-fragment
    description: What to use for the JS Fragment factory
    icon: data:image/png;base64,
    args:
      name: fragment
      suggestions:
        - React.Fragment
        - Fragment
    requiresSeparator: =
  - name: --jsx
    description: Preserve JSX instead of transforming
    icon: data:image/png;base64,
    args:
      suggestions:
        - name: preserve
          description: Preserve JSX instead of transforming
        - name: automatic
          description: Use React's new automatic JSX transform
    requiresSeparator: =
  - name: --jsx-dev
    description: Toggles development mode for the automatic runtime
    icon: data:image/png;base64,
  - name: --jsx-import-source
    description: "Overrides the root import for runtime functions (default: react)"
    icon: data:image/png;base64,
    args:
      name: source
      default: react
    requiresSeparator: =
  - name: --keep-names
    description: Preserve 'name' on functions and classes
    icon: data:image/png;base64,
  - name: --legal-comments
    description: Where to place legal comments
    icon: data:image/png;base64,
    args:
      name: location
      suggestions:
        - none
        - inline
        - eof
        - linked
        - external
    requiresSeparator: =
  - name: --log-level
    description: Set the log level
    icon: data:image/png;base64,
    args:
      name: level
      suggestions:
        - verbose
        - debug
        - info
        - warning
        - error
        - silent
      default: info
    requiresSeparator: =
  - name: --log-limit
    description: Maximum message count, 0 to disable
    icon: data:image/png;base64,
    args:
      name: count
      default: "6"
    requiresSeparator: =
  - name: --log-override
    description: For a particular identifier, set the log level
    icon: data:image/png;base64,
    args:
      name: identifier:level
      generators:
        js:
          custom: 14
          trigger: 12
          getQueryTerm: 13
    requiresSeparator: ":"
  - name: --main-fields
    description: Override the main file order in package.json
    icon: data:image/png;base64,
    args:
      name: field order
      default: browser,module,main
    requiresSeparator: =
  - name: --mangle-cache
    description: Save 'mangle props' decisions to a JSON file
    icon: data:image/png;base64,
    args:
      name: path
      template: filepaths
      suggestCurrentToken: true
    requiresSeparator: =
  - name: --mangle-props
    description: Rename all properties matching a regular expression
    icon: data:image/png;base64,
    args:
      name: regex
    requiresSeparator: =
  - name: --mangle-quoted
    description: Enable mangling (renaming) quoted properties
    icon: data:image/png;base64,
    args:
      name: status
      suggestions:
        - "true"
        - "false"
    requiresSeparator: =
  - name: --metafile
    description: Write metadata about the build to a JSON file
    icon: data:image/png;base64,
    args:
      name: path
      template: filepaths
      suggestCurrentToken: true
    requiresSeparator: =
  - name: --minify-whitespace
    description: Remove unnecessary whitespace in output files
    icon: data:image/png;base64,
  - name: --minify-identifiers
    description: Shorten identifiers in output files
    icon: data:image/png;base64,
  - name: --minify-syntax
    description: Use equivalent but shorter syntax in output files
    icon: data:image/png;base64,
  - name: --out-extension
    description: Use a custom output extension for each extension
    icon: data:image/png;base64,
    args:
      name: ext=new
      generators:
        js:
          custom: 17
          trigger: 15
          getQueryTerm: 16
    requiresSeparator: ":"
  - name: --outbase
    description: Base path used to determine entrypoint output paths, for multiple entrypoints
    icon: data:image/png;base64,
    args:
      name: path
      template: folders
    requiresSeparator: =
  - name: --preserve-symlinks
    description: Disable symlink resolution
    icon: data:image/png;base64,
  - name: --public-path
    description: Set the base URL for the 'file' loader
    icon: data:image/png;base64,
    args:
      name: path
      template: folders
    requiresSeparator: =
  - name: --pure
    description: Mark the name as a pure function for tree shaking
    icon: data:image/png;base64,
    args:
      name: name
    requiresSeparator: ":"
  - name: --reserve-props
    description: Do not mangle these properties
    icon: data:image/png;base64,
    args:
      name: properties
    requiresSeparator: =
  - name: --resolve-extensions
    description: Comma-separated list of implicit extensions
    icon: data:image/png;base64,
    args:
      name: extensions
      generators:
        js:
          custom: 20
          trigger: 18
          getQueryTerm: 19
    requiresSeparator: =
  - name: --servedir
    description: What to serve in addition to the generated output files
    icon: data:image/png;base64,
    args:
      name: path
      template: folders
    requiresSeparator: =
  - name: --source-root
    description: Set the sourceRoot field in generated source maps
    icon: data:image/png;base64,
    args:
      name: URL
    requiresSeparator: =
  - name: --sourcefile
    description: Set the source file for the source map if there's no file name to use
    icon: data:image/png;base64,
    args:
      name: name
    requiresSeparator: =
  - name: --sourcemap
    description: Generate source maps?
    icon: data:image/png;base64,
    priority: 51
    args:
      name: options
      isOptional: true
      suggestions:
        - name: external
          description: Generate a separate .map.js file with no comment
        - name: inline
          description: Append source maps to JS files
    requiresSeparator: =
  - name: --sources-content
    displayName: --sources-content=false
    description: Omit the sourcesContent field in generated source maps
    icon: data:image/png;base64,
    insertValue: --sources-content=false
    args:
      suggestions:
        - "false"
    requiresSeparator: =
  - name: --supported
    description: Consider a given syntax to be supported
    icon: data:image/png;base64,
    args:
      name: syntax=status
      generators:
        js:
          custom: 23
          trigger: 21
          getQueryTerm: 22
    requiresSeparator: ":"
  - name: --tree-shaking
    description: Force tree shaking on or off
    icon: data:image/png;base64,
    args:
      name: status
      suggestions:
        - "true"
        - "false"
    requiresSeparator: =
  - name: --tsconfig
    description: Use this TypeScript config instead of the default
    icon: data:image/png;base64,
    args:
      name: path
      template: filepaths
    requiresSeparator: =
  - name: --version
    description: Print the current version and exit
    icon: data:image/png;base64,
args:
  name: entry points
  isVariadic: true
  template: filepaths
parserDirectives:
  optionArgSeparators:
    - =
    - ":"
