# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: iconv
description: Character set conversion
options:
  - name: --help
    description: Show help for iconv
  - name: --version
    description: Output version information and exit
  - name:
      - -f
      - --from-code
    description: Specifies the encoding of the input
    args:
      name: encoding
      generators:
        script:
          - bash
          - -c
          - iconv -l | command tr ' ' '\n' | sort
        js:
          postProcess: 0
    exclusiveOn:
      - -l
      - --list
  - name:
      - -t
      - --to-code
    description: Specifies the encoding of the output
    args:
      name: encoding
      generators:
        script:
          - bash
          - -c
          - iconv -l | command tr ' ' '\n' | sort
        js:
          postProcess: 0
    exclusiveOn:
      - -l
      - --list
  - name: -c
    description: Discard unconvertible characters
    exclusiveOn:
      - -l
      - --list
  - name:
      - -l
      - --list
    description: List the supported encodings
    exclusiveOn:
      - -f
      - --from-code
      - -t
      - --to-code
      - --unicode-subst
      - --byte-subst
      - --widechar-subst
  - name: --unicode-subst
    description: Substitution for unconvertible Unicode characters
    args:
      name: FORMATSTRING
      description: The formatstring must be a format string in the same format as for the printf command
    requiresSeparator: true
    exclusiveOn:
      - -l
      - --list
  - name: --byte-subst
    description: Substitution for unconvertible bytes
    args:
      name: FORMATSTRING
      description: The formatstring must be a format string in the same format as for the printf command
    requiresSeparator: true
    exclusiveOn:
      - -l
      - --list
  - name: --widechar-subst
    description: Substitution for unconvertible wide characters
    args:
      name: FORMATSTRING
      description: The formatstring must be a format string in the same format as for the printf command
    requiresSeparator: true
    exclusiveOn:
      - -l
      - --list
args:
  name: inputfile
  isVariadic: true
  template: filepaths
