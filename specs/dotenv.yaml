# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: dotenv
description: Loads environment variables from .env
options:
  - name: -f
    description: List of env files to parse
    args:
      template: filepaths
    exclusiveOn:
      - -h
      - -v
      - -t
  - name:
      - -h
      - --help
    description: Display help
    exclusiveOn:
      - -f
      - -v
      - -t
  - name:
      - -v
      - --version
    description: Show version
    exclusiveOn:
      - -f
      - -h
      - -t
  - name:
      - -t
      - --template
    description: Create a template env file
    args:
      template: filepaths
    exclusiveOn:
      - -f
      - -h
      - -v
args:
  isCommand: true
