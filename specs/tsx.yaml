# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: tsx
description: Run TypeScript file using tsx
subcommands:
  - name: watch
    description: Run the script and watch for changes
    args:
      name: script path
      isScript: true
      generators:
        template: filepaths
        filter:
          extensions:
            - ts
options:
  - name:
      - --help
      - -h
    description: Show help for tsx
    isPersistent: true
  - name: --no-cache
    description: Disable caching
    isPersistent: true
  - name: --clear-screen
    description: Disable clearing the screen on rerun
    insertValue: --clear-screen=false
    args:
      name: script path
      isScript: true
      generators:
        template: filepaths
        filter:
          extensions:
            - ts
    isPersistent: true
    dependsOn:
      - watch
  - name:
      - -v
      - --version
    description: Show version
  - name: --tsconfig
    description: Custom tsconfig.json path
    args:
      name: tsconfig.json path
      generators:
        template: filepaths
        filter:
          extensions:
            - json
args:
  name: script path
  isScript: true
  generators:
    template: filepaths
    filter:
      extensions:
        - ts
