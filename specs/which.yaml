# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: which
description: Locate a program in the user's PATH
options:
  - name: -s
    description: No output, return 0 if all the executables are found, 1 if not
  - name: -a
    description: List all instances of executables found, instead of just the first
args:
  name: names
  isVariadic: true
  generators:
    script:
      - bash
      - -c
      - |-
        for i in $(echo $PATH | tr ":" "
        "); do find $i -maxdepth 1 -perm -111 -type f; done
    js:
      postProcess: 0
  filterStrategy: fuzzy
  suggestCurrentToken: true
