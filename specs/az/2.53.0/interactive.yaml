# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: interactive
description: Start interactive mode. Installs the Interactive extension if not installed already
options:
  - name:
      - --style
      - -s
    description: The colors of the shell
    args:
      name: style
      suggestions:
        - bg
        - br
        - contrast
        - default
        - grey
        - halloween
        - neon
        - none
        - pastel
        - primary
        - purple
        - quiet
  - name: --update
    description: Update the Interactive extension to the latest available
    args:
      name: update
