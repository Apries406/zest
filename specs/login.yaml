# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: login
description: Begin session on the system
options:
  - name: -p
    description: Preserve environment
  - name: -r
    description: Perform autologin protocol for rlogin
  - name: -h
    description: Specify host
    args:
      name: host
  - name: -f
    description: Don't authenticate user, user is preauthenticated
args:
  name: username
  generators:
    script:
      - cat
      - /etc/passwd
    js:
      postProcess: 0
