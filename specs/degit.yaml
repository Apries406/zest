# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: degit
description: Straightforward project scaffolding
options:
  - name: --help
    description: Print help
  - name:
      - -f
      - --force
    description: Overwrite existing files
  - name:
      - -c
      - --cache
    description: Use a cache
  - name:
      - -v
      - --verbose
    description: Be verbose?
  - name:
      - -m
      - --mode
    description: Clone mode
    args:
      name: mode
      suggestions:
        - git
        - tar
args:
  - name: user/repo
    generators:
      js:
        custom: 1
        trigger: 0
  - name: location
    isOptional: true
    template: folders
    suggestCurrentToken: true
