# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: bcd
description: Bookmark directories and move to them
options:
  - name:
      - -s
      - --store
    description: Store the current directory as a bookmark
    args:
      name: store
      isOptional: true
    isRepeatable: true
  - name:
      - -r
      - --remove
    description: Remove a specified bookmark
    args:
      name: remove
      isOptional: true
    isRepeatable: true
  - name:
      - -i
      - --install
    description: Setup the shell init script
  - name:
      - -l
      - --list
    description: List the stored bookmarks
  - name:
      - -V
      - --version
    description: Print version information
  - name:
      - -h
      - --help
    description: Print help information
args:
  name: bookmark
  isOptional: true
