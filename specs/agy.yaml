name: agy
subcommands:
  - name: agent
    description: List available agents
    options:
      - name: -h
        description: Show help
      - name: --help
        description: Show help
  - name: agents
    description: List available agents
    options:
      - name: -h
        description: Show help
      - name: --help
        description: Show help
  - name: changelog
    description: Show changelog and release notes
    options:
      - name: -h
        description: Show help
      - name: --help
        description: Show help
  - name: help
    description: Show help for subcommands
  - name: install
    description: Configure environment paths and shell settings
  - name: mcp
    description: Manage MCP servers (add, remove, list, enable, disable)
    subcommands:
      - name: add
        description: Add or update an MCP server configuration
        options:
          - name: -H
            description: Short alias for --header (default [])
          - name: -e
            description: Short alias for --env (default [])
          - name: --env
            description: Environment variable KEY=value (repeatable) (default [])
          - name: -h
            description: Show help
          - name: --header
            description: "HTTP header Key: Value (repeatable) (default [])"
          - name: --help
            description: Show help
          - name: -t
            description: Short alias for --type (default stdio)
          - name: --type
            description: "Server type: 'stdio' or 'http' (default stdio)"
      - name: remove
        description: Remove an MCP server configuration
      - name: list
        description: List all configured MCP servers
        options:
          - name: -h
            description: Show help
          - name: --help
            description: Show help
      - name: enable
        description: Enable an MCP server
        options:
          - name: -h
            description: Show help
          - name: --help
            description: Show help
      - name: disable
        description: Disable an MCP server
        options:
          - name: -h
            description: Show help
          - name: --help
            description: Show help
  - name: mic-serve
    description: Serve this machine's microphone to a CLI on another host
  - name: models
    description: List available models
    options:
      - name: -h
        description: Show help
      - name: --help
        description: Show help
  - name: plugin
    description: Manage plugins (install, uninstall, list, enable, disable)
    subcommands:
      - name: list
        description: List installed plugins
        args:
          name: --json
          isOptional: true
      - name: import
        description: Import plugins from gemini or claude
        args:
          name: source
          isOptional: true
      - name: install
        description: Install a plugin (supports plugin[@marketplace])
        args:
          name: target
      - name: uninstall
        description: Uninstall a plugin
        args:
          name: name
      - name: enable
        description: Enable a plugin
        args:
          name: name
      - name: disable
        description: Disable a plugin
        args:
          name: name
      - name: validate
        description: Check a plugin's manifest and files
        options:
          - name: --strict
            description: Also fail on warnings
          - name: --json
            description: Print the report as JSON
          - name:
              - -h
              - --help
            description: Show this help
        args:
          - name: path
            isOptional: true
          - name: --strict
            isOptional: true
          - name: --json
            isOptional: true
      - name: link
        description: Generate link to a marketplace
        args:
          - name: mp
          - name: target
      - name: help
        description: Show this help
  - name: plugins
    description: Alias for plugin
    subcommands:
      - name: list
        description: List installed plugins
        args:
          name: --json
          isOptional: true
      - name: import
        description: Import plugins from gemini or claude
        args:
          name: source
          isOptional: true
      - name: install
        description: Install a plugin (supports plugin[@marketplace])
        args:
          name: target
      - name: uninstall
        description: Uninstall a plugin
        args:
          name: name
      - name: enable
        description: Enable a plugin
        args:
          name: name
      - name: disable
        description: Disable a plugin
        args:
          name: name
      - name: validate
        description: Check a plugin's manifest and files
        options:
          - name: --strict
            description: Also fail on warnings
          - name: --json
            description: Print the report as JSON
          - name:
              - -h
              - --help
            description: Show this help
        args:
          - name: path
            isOptional: true
          - name: --strict
            isOptional: true
          - name: --json
            isOptional: true
      - name: link
        description: Generate link to a marketplace
        args:
          - name: mp
          - name: target
      - name: help
        description: Show this help
  - name: remote-control
    description: Manage the remote-control background daemon (start, status, stop)
  - name: update
    description: Update CLI
options:
  - name: --add-dir
    description: Add a directory to the workspace (repeatable) (default [])
  - name: --agent
    description: Agent for the current CLI session
  - name: -c
    description: Short alias for --continue
  - name: --continue
    description: Continue the most recent conversation
  - name: --conversation
    description: Resume a previous conversation by ID
  - name: --dangerously-skip-permissions
    description: Auto-approve all tool permission requests without prompting
  - name: --disable-slash-commands
    description: Disable slash command and skill expansion in print mode
  - name: --effort
    description: Reasoning effort for the current CLI session (low|medium|high|xhigh|max)
  - name: -i
    description: Short alias for --prompt-interactive
  - name: --input-format
    description: Input format for print mode (text, stream-json). stream-json reads one NDJSON message per line from stdin and runs a turn for each; it requires --output-format stream-json (default text)
  - name: --json-schema
    description: Optional JSON schema string or path to a schema file to enforce structured output (for stream-json, only applicable to the final result)
  - name: --log-file
    description: Override CLI log file path
  - name: --mode
    description: Set the agent execution mode for this session (accept-edits, auto, plan)
  - name: --model
    description: Model for the current CLI session
  - name: --new-project
    description: Create a new project for this session
  - name: --output-format
    description: Output format for print mode (text, json, stream-json) (default text)
  - name: -p
    description: Short alias for --print
  - name: --print
    description: Run a single prompt non-interactively and print the response
  - name: --print-timeout
    description: Optional time limit for print mode; 0 waits until the turn completes (default 0s)
  - name: --project
    description: Project ID or project name for the current CLI session
  - name: --prompt
    description: Alias for --print
  - name: --prompt-interactive
    description: Run an initial prompt interactively and continue the session
  - name: --remote-control
    description: Create a remote connection for the CLI session on start up
  - name: --sandbox
    description: Run in a sandbox with terminal restrictions enabled
  - name: --settings
    description: "Settings for this session only, never saved: a JSON object of settings.json keys, inline or as a file path"
args:
  name: args
  isOptional: true
  isVariadic: true
