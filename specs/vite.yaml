# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: vite
description: Native ESM-powered web dev build tool
icon: https://vitejs.dev/logo.svg
subcommands:
  - name: build
    description: Build for production
    icon: 🛠
    options:
      - name: --target
        description: Transpile target (must be a valid esbuild target)
        args:
          name: target
      - name: --outDir
        description: Output directory
        args:
          name: dir
          template: folders
      - name: --assetsDir
        description: Directory under outDir to place assets in
        args:
          name: dir
          template: folders
      - name: --assetsInlineLimit
        description: Static asset base64 inline threshold in bytes
        args:
          name: number
      - name: --ssr
        description: Build specified entry for server-side rendering
        args:
          name: entry
          isOptional: true
          template: filepaths
      - name: --sourcemap
        description: Output sourcemaps for build
      - name: --minify
        description: Enable minification
        args:
          name: minifier
          isOptional: true
          suggestions:
            - terser
            - esbuild
      - name: --manifest
        description: Emit build manifest json
        args:
          name: name
          isOptional: true
      - name: --ssrManifest
        description: Emit ssr manifest json
        args:
          name: name
          isOptional: true
      - name: --emptyOutDir
        description: Force empty outDir when it's outside of root
      - name:
          - -w
          - --watch
        description: Rebuilds when modules have changed on disk
    args:
      name: root
      isOptional: true
      template: folders
  - name: optimize
    description: Pre-bundle dependencies
    icon: 📦
    options:
      - name: --force
        description: For the optimizer to re-bundle
    args:
      name: root
      isOptional: true
      template: folders
  - name: preview
    description: Locally preview the production build
    icon: ✨
    options:
      - name: --host
        description: Specify the hostname
        args:
          name: host
          isOptional: true
      - name: --port
        description: Specify the port
        args:
          name: port
      - name: --https
        description: Use TLS + HTTP/2
      - name: --open
        description: Open browser on startup
        args:
          name: browser
          isOptional: true
          template: filepaths
      - name: --strictPort
        description: Exit if the port is already in use
    args:
      name: root
      isOptional: true
      template: folders
options:
  - name:
      - -h
      - --help
    description: Show help message
    isPersistent: true
  - name: --host
    description: Specify the hostname
    args:
      name: host
      isOptional: true
  - name: --port
    description: Specify the port
    args:
      name: port
  - name: --https
    description: Use TLS + HTTP/2
  - name: --open
    description: Open browser on startup
    args:
      name: browser
      isOptional: true
      template: filepaths
  - name: --cors
    description: Enable CORS
  - name: --strictPort
    description: Exit if the port is already in use
  - name: --force
    description: For the optimizer to re-bundle
  - name:
      - -c
      - --config
    description: Use the specified config file
    args:
      name: file
      template: filepaths
    isPersistent: true
  - name: --base
    description: Public base path
    args:
      name: path
      default: /
    isPersistent: true
  - name:
      - -l
      - --logLevel
    description: Set the log level
    args:
      name: level
      suggestions:
        - name: info
          icon: 💬
        - name: warn
          icon: ⚠️
        - name: error
          icon: 💥
        - name: silent
          icon: 🤫
    isPersistent: true
  - name: --clearScreen
    description: Enable screen clearing when logging
    isPersistent: true
  - name:
      - -d
      - --debug
    description: Show debug logs
    args:
      name: feat
      isOptional: true
    isPersistent: true
  - name:
      - -f
      - --filter
    description: Filter debug logs
    args:
      name: filter
    isPersistent: true
  - name:
      - -m
      - --mode
    description: Set env mode
    args:
      name: mode
      generators:
        script:
          - ls
          - -l1A
        js:
          postProcess: 0
    isPersistent: true
  - name:
      - -v
      - --version
    description: Display version number
args:
  name: root
  isOptional: true
  template: folders
