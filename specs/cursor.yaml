# Imported from a Fig spec. You can edit this file; see docs/adding-a-command.md.
name: cursor
subcommands:
  - name: tunnel
    description: Make the current machine accessible from vscode.dev or other machines through a secure tunnel
    subcommands:
      - name: prune
        description: Delete all servers which are currently not running
        options:
          - name:
              - -h
              - --help
            description: Print help
          - name: --cli-data-dir
            description: "Directory where CLI metadata should be stored [env: VSCODE_CLI_DATA_DIR=]"
            args:
              name: CLI_DATA_DIR
          - name: --verbose
            description: Print verbose output (implies --wait)
          - name: --log
            description: "Log level to use [possible values: trace, debug, info, warn, error, critical, off]"
            args:
              name: level
      - name: kill
        description: Stops any running tunnel on the system
      - name: restart
        description: Restarts any running tunnel on the system
        options:
          - name:
              - -h
              - --help
            description: Print help
          - name: --cli-data-dir
            description: "Directory where CLI metadata should be stored [env: VSCODE_CLI_DATA_DIR=]"
            args:
              name: CLI_DATA_DIR
          - name: --verbose
            description: Print verbose output (implies --wait)
          - name: --log
            description: "Log level to use [possible values: trace, debug, info, warn, error, critical, off]"
            args:
              name: level
      - name: status
        description: Gets whether there is a tunnel running on the current machine
        options:
          - name:
              - -h
              - --help
            description: Print help
          - name: --cli-data-dir
            description: "Directory where CLI metadata should be stored [env: VSCODE_CLI_DATA_DIR=]"
            args:
              name: CLI_DATA_DIR
          - name: --verbose
            description: Print verbose output (implies --wait)
          - name: --log
            description: "Log level to use [possible values: trace, debug, info, warn, error, critical, off]"
            args:
              name: level
      - name: rename
        description: Rename the name of this machine associated with port forwarding service
        options:
          - name:
              - -h
              - --help
            description: Print help
          - name: --cli-data-dir
            description: "Directory where CLI metadata should be stored [env: VSCODE_CLI_DATA_DIR=]"
            args:
              name: CLI_DATA_DIR
          - name: --verbose
            description: Print verbose output (implies --wait)
          - name: --log
            description: "Log level to use [possible values: trace, debug, info, warn, error, critical, off]"
            args:
              name: level
      - name: unregister
        description: Remove this machine's association with the port forwarding service
        options:
          - name:
              - -h
              - --help
            description: Print help
          - name: --cli-data-dir
            description: "Directory where CLI metadata should be stored [env: VSCODE_CLI_DATA_DIR=]"
            args:
              name: CLI_DATA_DIR
          - name: --verbose
            description: Print verbose output (implies --wait)
          - name: --log
            description: "Log level to use [possible values: trace, debug, info, warn, error, critical, off]"
            args:
              name: level
      - name: user
        subcommands:
          - name: login
            description: Log in to port forwarding service
          - name: logout
            description: Log out of port forwarding service
          - name: show
            description: Show the account that's logged into port forwarding service
          - name: help
            description: Print this message or the help of the given subcommand(s)
        options:
          - name:
              - -h
              - --help
            description: Print help
          - name: --cli-data-dir
            description: "Directory where CLI metadata should be stored [env: VSCODE_CLI_DATA_DIR=]"
            args:
              name: CLI_DATA_DIR
          - name: --verbose
            description: Print verbose output (implies --wait)
          - name: --log
            description: "Log level to use [possible values: trace, debug, info, warn, error, critical, off]"
            args:
              name: level
      - name: service
        description: (Preview) Manages the tunnel when installed as a system service,
        subcommands:
          - name: install
            description: Installs or re-installs the tunnel service on the machine
          - name: uninstall
            description: Uninstalls and stops the tunnel service
          - name: log
            description: Shows logs for the running service
          - name: help
            description: Print this message or the help of the given subcommand(s)
        options:
          - name:
              - -h
              - --help
            description: Print help
          - name: --cli-data-dir
            description: "Directory where CLI metadata should be stored [env: VSCODE_CLI_DATA_DIR=]"
            args:
              name: CLI_DATA_DIR
          - name: --verbose
            description: Print verbose output (implies --wait)
          - name: --log
            description: "Log level to use [possible values: trace, debug, info, warn, error, critical, off]"
            args:
              name: level
      - name: help
        description: Print this message or the help of the given subcommand(s)
    options:
      - name: --install-extension
        description: Requests that extensions be preloaded and installed on connecting servers
        args:
          name: INSTALL_EXTENSION
      - name: --server-data-dir
        description: Specifies the directory that server data is kept in
        args:
          name: SERVER_DATA_DIR
      - name: --extensions-dir
        description: Set the root path for extensions
        args:
          name: EXTENSIONS_DIR
      - name:
          - -h
          - --help
        description: Print help
      - name: --random-name
        description: Randomly name machine for port forwarding service
      - name: --no-sleep
        description: Prevents the machine going to sleep while this command runs
      - name: --name
        description: Sets the machine name for port forwarding service
        args:
          name: NAME
      - name: --accept-server-license-terms
        description: If set, the user accepts the server license terms and the server will be started without a user prompt
      - name: --cli-data-dir
        description: "Directory where CLI metadata should be stored [env: VSCODE_CLI_DATA_DIR=]"
        args:
          name: CLI_DATA_DIR
      - name: --verbose
        description: Print verbose output (implies --wait)
      - name: --log
        description: "Log level to use [possible values: trace, debug, info, warn, error, critical, off]"
        args:
          name: level
  - name: agent
    description: Start the Cursor agent in your terminal.
    subcommands:
      - name: install-shell-integration
        description: Install shell integration to ~/.zshrc
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name: uninstall-shell-integration
        description: Remove shell integration from ~/.zshrc
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name: login
        description: Authenticate with Cursor. Set NO_OPEN_BROWSER to disable browser opening.
      - name: logout
        description: Sign out and clear stored authentication
      - name: mcp
        description: Manage MCP servers
        subcommands:
          - name: login
            description: Authenticate with an MCP server configured in .cursor/mcp.json or ~/.cursor/mcp.json
            args:
              name: identifier
          - name: list
            description: List configured MCP servers and their status
          - name: list-tools
            description: List available tools and their argument names for a specific MCP
            args:
              name: identifier
          - name: enable
            description: Add an MCP server to the local approved list
            args:
              name: identifier
          - name: disable
            description: Disable an MCP server (it will not be loaded or prompted for approval)
            args:
              name: identifier
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name: plugin
        description: Manage plugins and plugin marketplaces
        subcommands:
          - name: marketplace
            description: Manage plugin marketplaces
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name: worker
        description: Start a private cloud worker that connects to Cursor to run agents in your environment
        subcommands:
          - name: start
            description: Start the worker and connect to Cursor
          - name: debug
            description: Run private worker preflight diagnostics for auth, privacy, routing, and visibility
          - name: help
            description: Display help for command
        options:
          - name: --auth-token-file
            description: Path to a file containing the worker auth token. Intended for operator-managed Secret mounts.
            args:
              name: path
          - name: --worker-dir
            description: Workspace root to expose to agents (repeatable; first value is the assignment identity and defaults to current directory)
            args:
              name: path
          - name: --management-addr
            description: "Listen address for an optional HTTP server: GET /healthz, /readyz (Kubernetes probes), and /metrics (Prometheus text scrape) (e.g. ':8080' or '0.0.0.0:8080')"
            args:
              name: address
          - name: --label
            description: "Add a label to the worker (format: key=value, can be used multiple times). Cannot be used with --labels-file."
            args:
              name: key=value
          - name: --labels-file
            description: "Path to a JSON or TOML file containing labels. Cannot be used with --label. Can also be set via CURSOR_WORKER_LABELS_FILE env var. (env: CURSOR_WORKER_LABELS_FILE)"
            args:
              name: path
          - name: --idle-release-timeout
            description: Seconds the worker may stay connected after becoming idle before it is released. When the timeout hits, the worker exits with code 0 so a supervisor can restart a clean process. Default 3600. Pass 0 to disable
            args:
              name: seconds
          - name: --pool
            description: Register for pool assignment (one cloud agent claims this worker at a time). Optional pool name; defaults to 'default'. Without --pool, the worker allows shared assignment (multiple concurrent agents).
            args:
              name: name
              isOptional: true
          - name: --mint-github-token
            description: Receive short-lived GitHub tokens during claimed runs. Pool workers only (requires --pool). This does not enable dashboard secret sync. Requires your team admin to enable GitHub token minting for self-hosted
          - name: --sync-dashboard-secrets
            description: Receive eligible dashboard Cloud Agent secrets as environment variables during claimed runs. Pool workers only (requires --pool). This does not enable GitHub token delivery. Requires your team admin to enable
          - name: --identity-socket
            description: Expose a per-claim OIDC identity socket to claimed agents (published as CURSOR_AGENT_SOCKET in agent shells). Agents can POST /v1/tokens/oidc over it to mint short-lived Cursor cloud-agent identity tokens for an audience of their choice. Off
          - name: --computer-use
            description: Let claimed cloud agents drive this machine's desktop (screenshot, click, type). Explicit opt-in, off by default; never enabled by the server. Requires a Linux worker with a reachable X11 display plus
          - name: --single-use
            description: Same as --pool (legacy alias).
          - name: --pool-name
            description: "Deprecated alias for --pool <name>. Requires --pool or --single-use. (env: CURSOR_WORKER_POOL_NAME)"
            args:
              name: name
          - name: --name
            description: "Custom display name for this worker. Defaults to the machine hostname. (env: CURSOR_WORKER_NAME)"
            args:
              name: name
          - name: --data-dir
            description: "Base directory for logs, artifacts, and recording data. Defaults to /opt/cursor if writable, otherwise ~/.local/share/cursor-agent. (env: CURSOR_DATA_DIR)"
            args:
              name: path
          - name: --wait
            description: Wait for another worker using this data directory to stop. With no value, wait indefinitely; with seconds, exit if the timeout elapses.
            args:
              name: seconds
              isOptional: true
          - name: --debug
            description: Print worker debug diagnostics before starting bridge mode
          - name:
              - -h
              - --help
            description: Display help for command
      - name:
          - status
          - whoami
        description: View authentication status
        options:
          - name: --format
            description: 'Output format (choices: "text", "json", default: "text")'
            args:
              name: format
          - name:
              - -h
              - --help
            description: Display help for command
      - name: models
        description: List available models for this account
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name: bedrock
        description: Configure AWS Bedrock usage for CLI
        subcommands:
          - name: configure
            description: Configure AWS Bedrock settings (credentials, region, test model)
          - name: enable
            description: Enable Bedrock mode (requires stored credentials)
          - name: status
            description: Show Bedrock configuration and team-role availability
          - name: test
            description: Validate stored Bedrock credentials with the backend
          - name: clear
            description: Clear Bedrock credentials from secure storage and disable mode
          - name: disable
            description: Disable Bedrock mode but keep stored credentials
          - name: help
            description: Display help for command
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name: about
        description: Display version, system, and account information
        options:
          - name: --format
            description: 'Output format (choices: "text", "json", default: "text")'
            args:
              name: format
          - name:
              - -h
              - --help
            description: Display help for command
      - name: update
        description: Update Cursor Agent to the latest version
      - name: create-chat
        description: Create a new empty chat and return its ID
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name:
          - generate-rule
          - rule
        description: Generate a new Cursor rule with interactive prompts
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name: agent
        description: Start the Cursor Agent
        options:
          - name:
              - -h
              - --help
            description: Display help for command
        args:
          name: prompt
          isOptional: true
          isVariadic: true
      - name: ls
        description: Resume a chat session
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name: resume
        description: Resume the latest chat session
        options:
          - name:
              - -h
              - --help
            description: Display help for command
      - name: help
        description: Display help for command
    options:
      - name:
          - -v
          - --version
        description: Output the version number
      - name: --api-key
        description: API key for authentication (can also use CURSOR_API_KEY env var)
        args:
          name: key
      - name:
          - -H
          - --header
        description: "Add custom header to agent requests (format: 'Name: Value', can be used multiple times)"
        args:
          name: header
      - name:
          - -e
          - --endpoint
        description: 'Target API endpoint URL (can also use CURSOR_API_ENDPOINT env var) (default: "https://api2.cursor.sh", env: CURSOR_API_ENDPOINT)'
        args:
          name: url
      - name:
          - -p
          - --print
        description: "Print responses to console (for scripts or non-interactive use). Has access to all tools, including write and shell. (default: false)"
      - name: --output-format
        description: 'Output format (only works with --print): text | json | stream-json (default: "text")'
        args:
          name: format
      - name: --stream-partial-output
        description: "Stream partial output as individual text deltas (only works with --print and stream-json format) (default: false)"
      - name: --mode
        description: 'Start in the given execution mode. plan: read-only/planning (analyze, propose plans, no edits). ask: Q&A style for explanations and questions (read-only). (choices: "plan", "ask")'
        args:
          name: mode
      - name: --plan
        description: "Start in plan mode (shorthand for --mode=plan). (default: false)"
      - name: --resume
        description: "Select a session to resume (default: false)"
        args:
          name: chatId
          isOptional: true
      - name: --continue
        description: "Continue previous session (default: false)"
      - name: --model
        description: Model to use (e.g., gpt-5, sonnet-4-thinking). Parameterized models accept quoted bracket overrides, e.g. 'claude-opus-4-8[context=1m,effort=high,fast=false]'
        args:
          name: model
      - name: --list-models
        description: "List available models and exit (default: false)"
      - name:
          - -f
          - --force
        description: "Force allow commands unless explicitly denied (default: false)"
      - name: --yolo
        description: "Alias for --force (Run Everything) (default: false)"
      - name: --auto-review
        description: "Use Auto-review (Smart Auto): a server classifier auto-runs safe tool calls and prompts for the rest (default: false)"
      - name: --sandbox
        description: 'Explicitly enable or disable sandbox mode (overrides config) (choices: "enabled", "disabled")'
        args:
          name: mode
      - name: --approve-mcps
        description: "Automatically approve all MCP servers (default: false)"
      - name: --trust
        description: "Trust the current workspace without prompting (default: false)"
      - name: --workspace
        description: Workspace directory or saved workspace name to use (defaults to current working directory)
        args:
          name: path-or-name
      - name: --add-dir
        description: Add an additional workspace root directory (can be specified multiple times)
        args:
          name: path
      - name: --plugin-dir
        description: Load a local plugin directory (can be specified multiple times)
        args:
          name: path
      - name:
          - -w
          - --worktree
        description: Start in an isolated git worktree at ~/.cursor/worktrees/<reponame>/<name>. If omitted, a name is generated.
        args:
          name: name
          isOptional: true
      - name: --worktree-base
        description: "Branch or ref to base the new worktree on (default: current HEAD)"
        args:
          name: branch
      - name: --skip-worktree-setup
        description: "Skip running worktree setup scripts from .cursor/worktrees.json (default: false)"
      - name:
          - -h
          - --help
        description: Display help for command
options:
  - name: -d
    description: Compare two files with each other.
    args:
      - name: file
      - name: file
  - name: -m
    description: providing paths for two modified versions of a file, the common origin of both modified versions and the output file to save merge results.
    args:
      - name: path1
      - name: path2
      - name: base
      - name: result
  - name: -a
    description: Add folder(s) to the last active window.
    args:
      name: folder
  - name: --remove
    description: Remove folder(s) from the last active window.
    args:
      name: folder
  - name: -g
    description: Open a file at the path on the specified line and character position.
    args:
      name: file:line[:character
  - name: -n
    description: Force to open a new window.
  - name: -r
    description: Force to open a file or folder in an already opened window.
  - name: --suppress-popups-on-startup
    description: Suppress notification popups on startup.
  - name: --web-worker-exthost
    description: Run all web-capable extensions in a web worker extension host.
  - name: --glass
    description: Enable the multi-workbench architecture (dev-only).
  - name: --classic
    description: Disable glass mode and force classic windows (dev-only).
  - name: -w
    description: Wait for the files to be closed before returning.
  - name: --locale
    description: The locale to use (e.g. en-US or zh-TW).
    args:
      name: locale
  - name: --user-data-dir
    description: Specifies the directory that user data is kept in. Can be used to open multiple distinct instances of Code.
    args:
      name: dir
  - name: --profile
    description: Opens the provided folder or workspace with the given profile and associates the profile with the workspace. If the profile does not exist, a new empty one is created.
    args:
      name: profileName
  - name: -h
    description: Print usage.
  - name: --add-mcp
    description: Adds a Model Context Protocol server definition to the user profile, or workspace or folder when used with --mcp-workspace. Accepts JSON input in the form '{"name":"server-name","command":...} '
    args:
      name: json
  - name: --chat
    description: Open a standalone chat window without the full IDE.
  - name: --extensions-dir
    description: Set the root path for extensions.
    args:
      name: dir
  - name: --list-extensions
    description: List the installed extensions.
  - name: --show-versions
    description: Show versions of installed extensions, when using --list-extensions.
  - name: --category
    description: Filters installed extensions by provided category, when using --list-extensions.
    args:
      name: category
  - name: --install-extension
    description: "argument is either an extension id or a path to a VSIX. The identifier of an extension is '${publisher}.${name}'. Use '--force' argument to update to latest version. To install a specific version provide '@${version}'. For example:"
    args:
      name: ext-id | path
  - name: --pre-release
    description: Installs the pre-release version of the extension, when using --install-extension
  - name: --uninstall-extension
    description: Uninstalls an extension.
    args:
      name: ext-id
  - name: --update-extensions
    description: Update the installed extensions.
  - name: --enable-proposed-api
    description: Enables proposed API features for extensions. Can receive one or more extension IDs to enable individually.
    args:
      name: ext-id
  - name: -v
    description: Print version.
  - name: --verbose
    description: Print verbose output (implies --wait).
  - name: --log
    description: "Log level to use. Default is 'info'. Allowed values are 'critical', 'error', 'warn', 'info', 'debug', 'trace', 'off'. You can also configure the log level of an extension by passing extension id and log level in the following format:"
    args:
      name: level
  - name: -s
    description: Print process usage and diagnostics information.
  - name: --prof-startup
    description: Run CPU profiler during startup.
  - name: --disable-extensions
    description: Disable all installed extensions. This option is not persisted and is effective only when the command opens a new window.
  - name: --disable-extension
    description: Disable the provided extension. This option is not persisted and is effective only when the command opens a new window.
    args:
      name: ext-id
  - name: --sync
    description: Turn sync on or off.
    args:
      name: on | off
  - name: --inspect-extensions
    description: Allow debugging and profiling of extensions. Check the developer tools for the connection URI.
    args:
      name: port
  - name: --inspect-brk-extensions
    description: Allow debugging and profiling of extensions with the extension host being paused after start. Check the developer tools for the connection URI.
    args:
      name: port
  - name: --disable-lcd-text
    description: Disable LCD font rendering.
  - name: --disable-gpu
    description: Disable GPU hardware acceleration.
  - name: --disable-chromium-sandbox
    description: Use this option only when there is requirement to launch the application as sudo user on Linux or when running as an elevated user in an applocker environment on Windows.
  - name: --locate-shell-integration-path
    description: integration script. Allowed values are 'bash', 'pwsh', 'zsh' or 'fish'.
    args:
      name: shell
  - name: --telemetry
    description: Shows all telemetry events which VS code collects.
args:
  name: args
  isOptional: true
  isVariadic: true
