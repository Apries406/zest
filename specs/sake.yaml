# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: sake
description: 🍶 Swift-based utility for managing project commands, inspired by Make
subcommands:
  - name: init
    description: Initialize a new SakeApp project template for defining commands
    options:
      - name:
          - --config-path
          - -c
        description: Specify the path to the configuration file
        args:
          name: path
          template: filepaths
        isPersistent: true
      - name:
          - --sake-app-path
          - -s
        description: Specify the path for the SakeApp package
        args:
          name: path
          template: folders
        isPersistent: true
  - name: clean
    description: Remove all build artifacts generated by the SakeApp to ensure a clean state for future builds
    options:
      - name:
          - --config-path
          - -c
        description: Specify the path to the configuration file
        args:
          name: path
          template: filepaths
        isPersistent: true
      - name:
          - --sake-app-path
          - -s
        description: Specify the path for the SakeApp package
        args:
          name: path
          template: folders
        isPersistent: true
  - name: edit
    description: Open the SakeApp in Xcode (macOS only)
    options:
      - name:
          - --config-path
          - -c
        description: Specify the path to the configuration file
        args:
          name: path
          template: filepaths
        isPersistent: true
      - name:
          - --sake-app-path
          - -s
        description: Specify the path for the SakeApp package
        args:
          name: path
          template: folders
        isPersistent: true
  - name: list
    description: List all available commands defined in the SakeApp
    options:
      - name:
          - --config-path
          - -c
        description: Specify the path to the configuration file
        args:
          name: path
          template: filepaths
        isPersistent: true
      - name:
          - --sake-app-path
          - -s
        description: Specify the path for the SakeApp package
        args:
          name: path
          template: folders
        isPersistent: true
      - name: --case-converting-strategy
        description: Specify the strategy for converting command names' case
        priority: 55
        args:
          name: strategy
          suggestions:
            - keepOriginal
            - toSnakeCase
            - toKebabCase
          default: keepOriginal
      - name:
          - --sake-app-prebuilt-binary-path
          - -b
        description: Specify the path to the prebuilt SakeApp binary
        priority: 55
        args:
          name: path
          template: filepaths
      - name:
          - --json
          - -j
        description: Output the list of commands in JSON format
        priority: 45
  - name: build
    description: Manually trigger a rebuild of the SakeApp
    options:
      - name:
          - --config-path
          - -c
        description: Specify the path to the configuration file
        args:
          name: path
          template: filepaths
        isPersistent: true
      - name:
          - --sake-app-path
          - -s
        description: Specify the path for the SakeApp package
        args:
          name: path
          template: folders
        isPersistent: true
      - name: --show-bin-path
        description: Print the path to the built SakeApp executable
        priority: 45
  - name: run
    description: Run the specified command from the SakeApp
    options:
      - name:
          - --config-path
          - -c
        description: Specify the path to the configuration file
        args:
          name: path
          template: filepaths
        isPersistent: true
      - name:
          - --sake-app-path
          - -s
        description: Specify the path for the SakeApp package
        args:
          name: path
          template: folders
        isPersistent: true
      - name: --case-converting-strategy
        description: Specify the strategy for converting command names' case
        priority: 55
        args:
          name: strategy
          suggestions:
            - keepOriginal
            - toSnakeCase
            - toKebabCase
          default: keepOriginal
      - name:
          - --sake-app-prebuilt-binary-path
          - -b
        description: Specify the path to the prebuilt SakeApp binary
        priority: 55
        args:
          name: path
          template: filepaths
    args:
      name: command
      description: The command to run
      generators:
        script:
          - sake
          - list
          - --json
        js:
          postProcess: 1
options:
  - name:
      - --help
      - -h
    description: Show help information
    priority: 40
    isPersistent: true
  - name: --version
    description: Show the version
    priority: 40
