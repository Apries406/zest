# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: chezmoi
description: Manage your dotfiles across multiple diverse machines, securely
subcommands:
  - name:
      - manage
      - add
    description: Add an existing file, directory, or symlink to the source state
    options:
      - name:
          - --autotemplate
          - -a
        description: Generate the template when adding files as templates
      - name: --create
        description: Add files that should exist, irrespective of their contents
      - name: --encrypt
        description: Encrypt files
      - name: --exact
        description: Add directories exactly
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --follow
          - -f
        description: Add symlink targets instead of symlinks
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: all
        requiresSeparator: true
      - name:
          - --prompt
          - -p
        description: Prompt before adding each entry
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
      - name:
          - --template
          - -T
        description: Add files as templates
      - name: --template-symlinks
        description: Add symlinks with target in source or home dirs as templates
    args:
      name: file
      isVariadic: true
      template:
        - filepaths
        - folders
  - name: apply
    description: Update the destination directory to match the target state
    options:
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: all
        requiresSeparator: true
      - name: --init
        description: Recreate config file from template
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
    args:
      name: target
      isOptional: true
      isVariadic: true
      template:
        - filepaths
        - folders
  - name: archive
    description: Generate a tar archive of the target state
    options:
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --format
          - -f
        description: Set archive format
        args:
          name: format
          suggestions:
            - tar
            - tar.bz2
            - tar.gz
            - tar.xz
            - tbz2
            - tgz
            - txz
            - zip
        requiresSeparator: true
      - name:
          - --gzip
          - -z
        description: Compress output with gzip
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: all
        requiresSeparator: true
      - name: --init
        description: Recreate config file from template
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
    args:
      name: target
      isOptional: true
      isVariadic: true
      template:
        - filepaths
        - folders
  - name: cat
    description: Print the target contents of a file, script, or symlink
    args:
      name: target
      isVariadic: true
      template:
        - filepaths
        - folders
  - name: cd
    description: Launch a shell in the source directory
  - name: chattr
    description: Change the attributes of a target in the source state
    args:
      - name: attributes/modifiers
        generators:
          getQueryTerm: ","
          js:
            custom: 4
            trigger: 3
      - name: target
        isVariadic: true
        template:
          - filepaths
          - folders
  - name: completion
    description: Generate shell completion code
    args:
      name: shell
      suggestions:
        - bash
        - fish
        - zsh
        - powershell
  - name: data
    description: Print the template data
    options:
      - name:
          - --format
          - -f
        description: Format
        args:
          name: format
          suggestions:
            - json
            - yaml
          default: json
        isPersistent: true
        requiresSeparator: true
  - name: decrypt
    description: Decrypt file or standard input
    args:
      name: file
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: diff
    description: Print the diff between the target state and the destination state
    options:
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: all
        requiresSeparator: true
      - name: --init
        description: Recreate config file from template
      - name: --pager
        description: Set pager
        args:
          name: pager
        requiresSeparator: true
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
      - name: --reverse
        description: Reverse the direction of the diff
      - name: --use-builtin-diff
        description: Use the builtin diff
    args:
      name: target
      isOptional: true
      isVariadic: true
  - name: doctor
    description: Check your system for potential problems
  - name: dump
    description: Generate a dump of the target state
    options:
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --format
          - -f
        description: Set output format
        args:
          name: format
          default: json
        requiresSeparator: true
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: all
        requiresSeparator: true
      - name: --init
        description: Recreate config file from template
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
    args:
      name: target
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: edit
    description: Edit the source state of a target
    options:
      - name:
          - --apply
          - -a
        description: Apply after editing
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name: --hardlink
        description: Invoke editor with a hardlink to the source file
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: dirs,files,symlinks,encrypted
        requiresSeparator: true
      - name: --init
        description: Recreate config file from template
    args:
      name: target
      isVariadic: true
      template: filepaths
  - name: edit-config
    description: Edit the configuration file
  - name: encrypt
    description: Encrypt file or standard input
    args:
      name: target
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: execute-template
    description: Execute the given template(s)
    options:
      - name:
          - --init
          - -i
        description: Simulate chezmoi init
      - name: --promptBool
        description: Simulate promptBool
        args:
          name: promptBool
        requiresSeparator: true
      - name: --promptInt
        description: Simulate promptInt
        args:
          name: promptInt
        requiresSeparator: true
      - name:
          - --promptString
          - -p
        description: Simulate promptString
        args:
          name: promptString
        requiresSeparator: true
      - name: --stdinisatty
        description: Simulate stdinIsATTY
    args:
      name: template
      isOptional: true
      isVariadic: true
      template: filepaths
  - name:
      - unmanage
      - forget
    description: Remove a target from the source state
    args:
      name: target
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: generate
    description: Generate a file for use with chezmoi
    insertValue: generate install.sh > install.sh
    args:
      name: file
      suggestions:
        - install.sh
  - name: git
    description: Run git in the source directory
    loadSpec: git
  - name: ignored
    description: Print ignored targets
  - name: import
    description: Import an archive into the source state
    options:
      - name: --exact
        description: Set exact_ attribute on imported directories
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: all
        requiresSeparator: true
      - name:
          - --remove-destination
          - -r
        description: Remove destination before import
      - name: --strip-components
        description: Strip leading path components
        args:
          name: strip-components
          default: "0"
        requiresSeparator: true
    args:
      name: archive
      template: filepaths
  - name: init
    description: Setup the source directory and update the destination directory to match the target state
    options:
      - name:
          - --apply
          - -a
        description: Update destination directory
      - name: --branch
        description: Set initial branch to checkout
        args:
          name: branch
        requiresSeparator: true
      - name:
          - --config-path
          - -C
        description: Path to write generated config file
        args:
          name: config-path
        requiresSeparator: true
      - name: --data
        description: Include existing template data
      - name:
          - --depth
          - -d
        description: Create a shallow clone
        args:
          name: depth
          default: "0"
        requiresSeparator: true
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --guess-repo-url
          - -g
        description: Guess the repo URL
      - name: --one-shot
        description: Run in one-shot mode
      - name: --prompt
        description: Force prompt*Once template functions to prompt
      - name:
          - --purge
          - -p
        description: Purge config and source directories after running
      - name:
          - --purge-binary
          - -P
        description: Purge chezmoi binary after running
      - name: --ssh
        description: Use ssh instead of https when guessing dotfile repo URL
    args:
      name: source
  - name: license
    description: Print license
  - name:
      - list
      - managed
    description: List the managed entries in the destination directory
    options:
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: dirs,files,symlinks,encrypted
        requiresSeparator: true
  - name: merge
    description: Perform a three-way merge between the destination state, the source state, and the target state
    args:
      name: target
      isVariadic: true
      template: filepaths
  - name: merge-all
    description: Perform a three-way merge for each modified file
    options:
      - name: --init
        description: Recreate config file from template
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
  - name: purge
    description: Purge chezmoi's configuration and data
    options:
      - name:
          - --binary
          - -P
        description: Purge chezmoi binary
  - name: re-add
    description: Re-add modified files
    options:
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: all
        requiresSeparator: true
  - name:
      - rm
      - remove
    description: Remove a target from the source state and the destination directory
    options:
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
    args:
      name: target
      isVariadic: true
      template: filepaths
  - name: secret
    description: Interact with a secret manager
    subcommands:
      - name: keyring
        description: Interact with keyring
        subcommands:
          - name: delete
            description: Delete a value from keyring
            options:
              - name: --service
                description: Service
                args:
                  name: service
                isPersistent: true
                isRequired: true
                requiresSeparator: true
              - name: --user
                description: User
                args:
                  name: user
                isPersistent: true
                isRequired: true
                requiresSeparator: true
          - name: get
            description: Get a value from keyring
            options:
              - name: --service
                description: Service
                args:
                  name: service
                isPersistent: true
                isRequired: true
                requiresSeparator: true
              - name: --user
                description: User
                args:
                  name: user
                isPersistent: true
                isRequired: true
                requiresSeparator: true
          - name: set
            description: Set a value in keyring
            options:
              - name: --service
                description: Service
                args:
                  name: service
                isPersistent: true
                isRequired: true
                requiresSeparator: true
              - name: --user
                description: User
                args:
                  name: user
                isPersistent: true
                isRequired: true
                requiresSeparator: true
              - name: --value
                description: Value
                args:
                  name: value
                isPersistent: true
                requiresSeparator: true
        requiresSubcommand: true
    requiresSubcommand: true
  - name: source-path
    description: Print the source path of a target
    args:
      name: target
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: state
    description: Manipulate the persistent state
    subcommands:
      - name: data
        description: Print the raw data in the persistent state
        options:
          - name:
              - --format
              - -f
            description: Format
            args:
              name: format
              default: json
            isPersistent: true
            requiresSeparator: true
      - name: delete
        description: Delete a value from the persistent state
        options:
          - name: --bucket
            description: Bucket
            args:
              name: bucket
            isPersistent: true
            requiresSeparator: true
          - name: --key
            description: Key
            args:
              name: key
            isPersistent: true
            requiresSeparator: true
      - name: delete-bucket
        description: Delete a bucket from the persistent state
        options:
          - name: --bucket
            description: Bucket
            args:
              name: bucket
            isPersistent: true
            requiresSeparator: true
      - name: dump
        description: Generate a dump of the persistent state
        options:
          - name:
              - --format
              - -f
            description: Format
            args:
              name: format
              default: json
            isPersistent: true
            requiresSeparator: true
      - name: get
        description: Get a value from the persistent state
        options:
          - name: --bucket
            description: Bucket
            args:
              name: bucket
            isPersistent: true
            requiresSeparator: true
          - name: --key
            description: Key
            args:
              name: key
            isPersistent: true
            requiresSeparator: true
      - name: get-bucket
        description: Get a bucket from the persistent state
        options:
          - name: --bucket
            description: Bucket
            args:
              name: bucket
            isPersistent: true
            requiresSeparator: true
          - name:
              - --format
              - -f
            description: Format
            args:
              name: format
              default: json
            isPersistent: true
            requiresSeparator: true
      - name: reset
        description: Reset the persistent state
      - name: set
        description: Set a value from the persistent state
        options:
          - name: --bucket
            description: Bucket
            args:
              name: bucket
            isPersistent: true
            requiresSeparator: true
          - name: --key
            description: Key
            args:
              name: key
            isPersistent: true
            requiresSeparator: true
          - name: --value
            description: Value
            args:
              name: value
            isPersistent: true
            requiresSeparator: true
    requiresSubcommand: true
  - name: status
    description: Show the status of targets
    options:
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: all
        requiresSeparator: true
      - name: --init
        description: Recreate config file from template
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
    args:
      name: target
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: target-path
    description: Print the target path of a source path
    args:
      name: source
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: unmanaged
    description: List the unmanaged files in the destination directory
    args:
      name: paths
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: update
    description: Pull and apply any changes
    options:
      - name:
          - --apply
          - -a
        description: Apply after pulling
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: all
        requiresSeparator: true
      - name: --init
        description: Recreate config file from template
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
  - name: upgrade
    description: Upgrade chezmoi to the latest released version
    options:
      - name: --executable
        description: Set executable to replace
        args:
          name: executable
        requiresSeparator: true
      - name: --method
        description: Set upgrade method
        args:
          name: method
        requiresSeparator: true
      - name: --owner
        description: Set owner
        args:
          name: owner
          default: twpayne
        requiresSeparator: true
      - name: --repo
        description: Set repo
        args:
          name: repo
          default: chezmoi
        requiresSeparator: true
  - name: verify
    description: Exit with success if the destination state matches the target state, fail otherwise
    options:
      - name:
          - --exclude
          - -x
        description: Exclude entry types
        args:
          name: exclude
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: none
        requiresSeparator: true
      - name:
          - --include
          - -i
        description: Include entry types
        args:
          name: include
          generators:
            js:
              custom: 2
              trigger: 0
              getQueryTerm: 1
          default: dirs,files,remove,symlinks,encrypted,externals
        requiresSeparator: true
      - name: --init
        description: Recreate config file from template
      - name:
          - --recursive
          - -r
        description: Recurse into subdirectories
    args:
      name: target
      isOptional: true
      isVariadic: true
      template: filepaths
  - name: help
    description: Help about any command
    subcommands:
      - name:
          - manage
          - add
        description: Add an existing file, directory, or symlink to the source state
      - name: apply
        description: Update the destination directory to match the target state
      - name: archive
        description: Generate a tar archive of the target state
      - name: cat
        description: Print the target contents of a file, script, or symlink
      - name: cd
        description: Launch a shell in the source directory
      - name: chattr
        description: Change the attributes of a target in the source state
      - name: completion
        description: Generate shell completion code
      - name: data
        description: Print the template data
      - name: decrypt
        description: Decrypt file or standard input
      - name: diff
        description: Print the diff between the target state and the destination state
      - name: doctor
        description: Check your system for potential problems
      - name: dump
        description: Generate a dump of the target state
      - name: edit
        description: Edit the source state of a target
      - name: edit-config
        description: Edit the configuration file
      - name: encrypt
        description: Encrypt file or standard input
      - name: execute-template
        description: Execute the given template(s)
      - name:
          - unmanage
          - forget
        description: Remove a target from the source state
      - name: generate
        description: Generate a file for use with chezmoi
      - name: git
        description: Run git in the source directory
      - name: ignored
        description: Print ignored targets
      - name: import
        description: Import an archive into the source state
      - name: init
        description: Setup the source directory and update the destination directory to match the target state
      - name: license
        description: Print license
      - name:
          - list
          - managed
        description: List the managed entries in the destination directory
      - name: merge
        description: Perform a three-way merge between the destination state, the source state, and the target state
      - name: merge-all
        description: Perform a three-way merge for each modified file
      - name: purge
        description: Purge chezmoi's configuration and data
      - name: re-add
        description: Re-add modified files
      - name:
          - rm
          - remove
        description: Remove a target from the source state and the destination directory
      - name: secret
        description: Interact with a secret manager
        subcommands:
          - name: keyring
            description: Interact with keyring
            subcommands:
              - name: delete
                description: Delete a value from keyring
              - name: get
                description: Get a value from keyring
              - name: set
                description: Set a value in keyring
      - name: source-path
        description: Print the source path of a target
      - name: state
        description: Manipulate the persistent state
        subcommands:
          - name: data
            description: Print the raw data in the persistent state
          - name: delete
            description: Delete a value from the persistent state
          - name: delete-bucket
            description: Delete a bucket from the persistent state
          - name: dump
            description: Generate a dump of the persistent state
          - name: get
            description: Get a value from the persistent state
          - name: get-bucket
            description: Get a bucket from the persistent state
          - name: reset
            description: Reset the persistent state
          - name: set
            description: Set a value from the persistent state
      - name: status
        description: Show the status of targets
      - name: target-path
        description: Print the target path of a source path
      - name: unmanaged
        description: List the unmanaged files in the destination directory
      - name: update
        description: Pull and apply any changes
      - name: upgrade
        description: Upgrade chezmoi to the latest released version
      - name: verify
        description: Exit with success if the destination state matches the target state, fail otherwise
options:
  - name: --cache
    description: Set cache directory
    args:
      name: cache
      default: ~/.cache/chezmoi
    isPersistent: true
    requiresSeparator: true
  - name: --color
    description: Colorize output
    args:
      name: color
      suggestions:
        - "true"
        - "false"
        - auto
      default: auto
    isPersistent: true
    requiresSeparator: true
  - name:
      - --config
      - -c
    description: Set config file
    args:
      name: config
