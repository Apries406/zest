# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: deployctl
description: Command line tool for Deno Deploy
subcommands:
  - name: deploy
    description: Deploy a script with static files to Deno Deploy
    options:
      - name: --exclude
        description: Exclude files that match this pattern
        insertValue: --exclude '{cursor}'
        args:
          name: pattern
      - name: --include
        description: Only upload files that match this pattern
        insertValue: --include '{cursor}'
        args:
          name: pattern
      - name: --no-static
        description: Don't include the files in the CWD as static files
      - name: --prod
        description: Create a production deployment (default is preview deployment)
      - name:
          - -p
          - --project
        description: The project to deploy to
        args:
          name: name
      - name: --token
        description: The API token to use
        args:
          name: token
    args:
      name: entrypoint
      generators:
        template: filepaths
        filter:
          extensions:
            - js
            - mjs
            - jsx
            - mjsx
            - ts
            - mts
            - tsx
            - mtsx
  - name: upgrade
    description: Upgrade deployctl
    args:
      name: version
      isOptional: true
      generators:
        script:
          - curl
          - -sL
          - https://cdn.deno.land/deploy/meta/versions.json
        cache:
          ttl: 86400
        js:
          postProcess: 1
options:
  - name:
      - --help
      - -h
    description: Show help
    isPersistent: true
  - name:
      - -V
      - --version
    description: Show the version
