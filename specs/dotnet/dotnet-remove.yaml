# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: remove
subcommands:
  - name: package
    description: The dotnet remove package command provides a convenient option to remove a NuGet package reference from a project
    args:
      name: id
  - name: reference
    description: The dotnet remove reference command provides a convenient option to remove project references from a project
    args:
      name: ref
      generators:
        template: filepaths
        filter:
          extensions:
            - csproj
args:
  name: project
  description: Specifies the project file. If not specified, the command searches the current directory for one
  isOptional: true
  generators:
    template: filepaths
    filter:
      extensions:
        - csproj
