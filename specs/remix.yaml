# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: remix
description: Remix CLI to start, build and export your application
subcommands:
  - name: build
    description: Create an optimized production build of your application
    icon: https://remix.run/favicon-dark.1.png
    options:
      - name: --sourcemap
        description: Enables production sourcemap
    args:
      name: dir
      description: Represent the directory of the Remix application
      isOptional: true
      template: folders
  - name: dev
    description: Start the application in development mode
    icon: https://remix.run/favicon-dark.1.png
    args:
      name: dir
      description: Represent the directory of the Remix application
      isOptional: true
      template: folders
  - name: setup
    description: Prepare node_modules/remix folder (after installation of packages)
    icon: https://remix.run/favicon-dark.1.png
    args:
      name: dir
      description: Represent the directory of the Remix application
      isOptional: true
      template: folders
  - name: routes
    description: Generate the route config of the application
    icon: https://remix.run/favicon-dark.1.png
    options:
      - name: --json
        description: Print the route config as JSON
    args:
      name: dir
      description: Represent the directory of the Remix application
      isOptional: true
      template: folders
options:
  - name: --help
    description: Output usage information
  - name:
      - -v
      - --version
    description: Output the version number
