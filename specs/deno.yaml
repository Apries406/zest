        description: Print help information
      - name: --unstable
        description: Enable unstable features and APIs
      - name:
          - -q
          - --quiet
        description: Suppress diagnostic output
    args:
      - name: files
        isOptional: true
        isVariadic: true
        template: filepaths
      - name: script_arg
        isOptional: true
        isVariadic: true
        template: filepaths
