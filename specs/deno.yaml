        requiresSeparator: true
      - name: --lock
        description: Check the specified lock file
        args:
          name: lock
          isOptional: true
          template: filepaths
      - name: --cert
        description: Load certificate authority from PEM encoded file
        args:
          name: cert
          isOptional: true
          template: filepaths
      - name: --allow-read
        description: Allow file system read access
        args:
          name: allow-read
          isOptional: true
          isVariadic: true
          template: filepaths
        requiresSeparator: true
      - name: --allow-write
        description: Allow file system write access
        args:
          name: allow-write
          isOptional: true
          isVariadic: true
          template: filepaths
        requiresSeparator: true
      - name: --allow-net
        description: Allow network access
        args:
          name: allow-net
          isOptional: true
          isVariadic: true
        requiresSeparator: true
      - name: --unsafely-ignore-certificate-errors
        description: "DANGER: Disables verification of TLS certificates"
        args:
          name: unsafely-ignore-certificate-errors
          description: Scope ignoring certificate errors to these hosts
          isOptional: true
          isVariadic: true
        requiresSeparator: true
      - name: --allow-env
        description: Allow environment access
        args:
          name: allow-env
          isOptional: true
          isVariadic: true
        requiresSeparator: true
      - name: --allow-run
        description: Allow running subprocesses
        args:
          name: allow-run
          isOptional: true
          isVariadic: true
        requiresSeparator: true
      - name: --allow-ffi
        description: Allow loading dynamic libraries
        args:
          name: allow-ffi
          isOptional: true
          isVariadic: true
          template: filepaths
        requiresSeparator: true
