# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: arch
description: Print architecture type or run select architecture
options:
  - name: "-32"
    description: Add the native 32-bit architecture to the list of architectures
  - name: "-64"
    description: Add the native 64-bit architecture to the list of architectures
  - name: -arch
    args:
      name: arch_name
      suggestions:
        - name: i386
          description: 32-bit intel
          icon: fig://icon?type=cpu
        - name: x86_64
          description: 64-bit intel
          icon: fig://icon?type=cpu
        - name: x86_64h
          description: 64-bit intel (haswell)
          icon: fig://icon?type=cpu
        - name: arm64
          description: 64-bit arm
          icon: fig://icon?type=cpu
        - name: arm64e
          description: 64-bit arm (Apple Silicon)
          icon: fig://icon?type=cpu
    isRepeatable: true
    exclusiveOn:
      - -i386
      - -x86_64
      - -x86_64h
      - -arm64
      - -arm64e
  - name: -i386
    description: 32-bit intel
    icon: fig://icon?type=cpu
    isRepeatable: true
    exclusiveOn:
      - -arch
  - name: -x86_64
    description: 64-bit intel
    icon: fig://icon?type=cpu
    isRepeatable: true
    exclusiveOn:
      - -arch
  - name: -x86_64h
    description: 64-bit intel (haswell)
    icon: fig://icon?type=cpu
    isRepeatable: true
    exclusiveOn:
      - -arch
  - name: -arm64
    description: 64-bit arm
    icon: fig://icon?type=cpu
    isRepeatable: true
    exclusiveOn:
      - -arch
  - name: -arm64e
    description: 64-bit arm (Apple Silicon)
    icon: fig://icon?type=cpu
    isRepeatable: true
    exclusiveOn:
      - -arch
  - name: -c
    description: Clear the environment that will be passed to the command
  - name: -d
    description: Delete the named environment variable from the command's environment
    args:
      name: envname
    isRepeatable: true
  - name: -e
    description: Assign the given value to the variable in the command's environment
    args:
      name: envname=value
    isRepeatable: true
  - name: -h
    description: Print a help message and exit
args:
  name: program
  isVariadic: true
  isCommand: true
  template: filepaths
parserDirectives:
  flagsArePosixNoncompliant: true
  optionsMustPrecedeArguments: true
