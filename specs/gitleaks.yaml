    description: report file (use "-" for stdout)
  - name: --report-template
    description: template file used to generate the report (implies --report-format=template)
  - name: --timeout
    description: set a timeout for gitleaks commands in seconds (default "0", no timeout is set)
  - name:
      - -v
      - --verbose
    description: show verbose output from scan
  - name: --version
    description: version for gitleaks
args:
  name: args
  isOptional: true
  isVariadic: true
