# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: github
description: Open a git repository in GitHub Desktop
subcommands:
  - name: clone
    description: Clone a repository
    options:
      - name:
          - --branch
          - -b
        description: The branch to checkout after cloning
        args:
          name: branch
    args:
      name: url|slug
      suggestions:
        - name: https://github.com/
          icon: https://github.com/fluidicon.png
        - name: https://gitlab.com/
          icon: https://about.gitlab.com/ico/favicon-32x32.png
        - name: https://bitbucket.com/
          icon: https://wac-cdn.atlassian.com/assets/img/favicons/bitbucket/favicon-32x32.png
  - name: open
    description: Open a git repository in GitHub Desktop
    args:
      name: path
      isOptional: true
      generators:
        template: folders
  - name: help
    description: Show the help page for a command
    args:
      name: command
      isOptional: true
      suggestions:
        - clone
        - open
        - help
options:
  - name: --help
    description: Show the help page for a command
    args:
      name: command
      isOptional: true
      suggestions:
        - clone
        - open
        - help
args:
  name: path
  isOptional: true
  generators:
    template: folders
