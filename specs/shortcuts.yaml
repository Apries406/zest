# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: shortcuts
description: Command-line utility for running shortcuts
subcommands:
  - name: run
    description: Run a shortcut
    icon: ▶️
    options:
      - name:
          - -i
          - --input-path
        description: The input to provide to the shortcut
        args:
          name: input-path
          template: filepaths
      - name:
          - -o
          - --output-path
        description: Where to write the shortcut output, if applicable
        args:
          name: output-path
          template: filepaths
      - name: --output-type
        description: What type to output data in, in Universal Type Identifier format
        args:
          name: output-type
          suggestions:
            - name: public.json
              description: JavaScript Object Notation (JSON)
            - name: public.plain-text
              description: Plain text
            - name: public.html
              description: HTML
            - name: public.xml
              description: XML
            - name: com.adobe.pdf
              description: Adobe PDF
            - name: public.vcard
              description: VCard
    args:
      name: shortcut-name
      description: The name of the shortcut to run
      generators:
        script:
          - shortcuts
          - list
        js:
          postProcess: 0
  - name: list
    description: List your shortcuts
    icon: 📂
    options:
      - name:
          - --folder-name
          - -f
        description: The name of the folder to list
        args:
          name: folder-name
          generators:
            script:
              - shortcuts
              - list
              - --folders
            js:
              postProcess: 1
      - name: --folders
        description: List folders instead of shortcuts
        icon: 📂
  - name: view
    description: View a shortcut in Shortcuts
    icon: 🔍
    args:
      name: shortcut-name
      description: The name of the shortcut to view
      generators:
        script:
          - shortcuts
          - list
        js:
          postProcess: 0
  - name: sign
    description: Sign a shortcut file
    icon: 🔏
    options:
      - name:
          - --input
          - -i
        description: The shortcut file to sign
        args:
          name: input
          generators:
            template: filepaths
            filter:
              extensions:
                - shortcut
      - name:
          - --output
          - -o
        description: Output path for the signed shortcut file
        args:
          name: output
          template: filepaths
      - name:
          - --mode
          - -m
        description: "The signing mode. (default: people-who-know-me)"
        args:
          name: mode
          suggestions:
            - people-who-know-me
            - anyone
  - name: help
    description: Show help information
    subcommands:
      - name: run
        description: Run a shortcut
        icon: ▶️
      - name: list
        description: List your shortcuts
        icon: 📂
      - name: view
        description: View a shortcut in Shortcuts
        icon: 🔍
      - name: sign
        description: Sign a shortcut file
        icon: 🔏
