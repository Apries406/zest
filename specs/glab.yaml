  - name: token
    description: Manage personal, project, or group tokens.
    subcommands:
      - name: create
        description: Creates user, group, or project access tokens.
        options:
          - name: -A
            description: "Access level of the token: one of 'guest', 'reporter', 'developer', 'maintainer', 'owner'. (no)"
          - name: --description
            description: Sets the token's description.
          - name: -D
            description: "Sets the token lifetime in days. Accepts: days (30d), weeks (4w), or hours in multiples of 24 (24h, 168h, 720h). Maximum: 365d. The token expires at midnight UTC on the calculated date. (30d)"
          - name: -E
            description: Sets the token's expiration date and time, in YYYY-MM-DD format. If not specified, --duration is used. (0001-01-01)
          - name: -g
            description: Create a group access token. Ignored if a user or repository argument is set.
          - name: -h
            description: Show help for this command.
          - name: --jq
            description: Filter JSON output with a jq expression.
          - name: -F
            description: Format output as 'text' for the token value, 'json' for the actual API token structure. (text)
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: -S
            description: Scopes for the token. Multiple scopes can be comma-separated or specified by repeating the flag. For a list, see https://docs.gitlab.com/security/tokens/access_token_scopes/. ([read_repository])
          - name: -U
            description: Create a personal access token. For the current user, use @me.
        args:
          name: name
      - name: list
        description: List user, group, or project access tokens.
        options:
          - name: -a
            description: List only the active tokens.
          - name: -g
            description: List group access tokens. Ignored if a user or repository argument is set.
          - name: -h
            description: Show help for this command.
          - name: --jq
            description: Filter JSON output with a jq expression.
          - name: -F
            description: "Format output as: text, json. text provides a readable table, json outputs the tokens with metadata. (text)"
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: -U
            description: List personal access tokens. Use @me for the current user.
      - name: revoke
        description: Revoke user, group, or project access tokens.
        options:
          - name: -g
            description: Revoke group access token. Ignored if a user or repository argument is set.
          - name: -h
            description: Show help for this command.
          - name: --jq
            description: Filter JSON output with a jq expression.
          - name: -F
            description: "Format output as: text, json. 'text' provides the name and ID of the revoked token; 'json' outputs the token with metadata. (text)"
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: -U
            description: Revoke personal access token. Use @me for the current user.
        args:
          name: token-name|token-id
      - name: rotate
        description: Rotate user, group, or project access tokens.
        options:
          - name: -D
            description: "Sets the token lifetime in days. Accepts: days (30d), weeks (4w), or hours in multiples of 24 (24h, 168h, 720h). Maximum: 365d. The token expires at 00:00 UTC on the calculated date. (30d)"
          - name: -E
            description: Sets the token's expiration date and time, in YYYY-MM-DD format. If not specified, --duration is used. (0001-01-01)
          - name: -g
            description: Rotate group access token. Ignored if a user or repository argument is set.
          - name: -h
            description: Show help for this command.
          - name: --jq
            description: Filter JSON output with a jq expression.
          - name: -F
            description: "Format output as: text, json. 'text' provides the new token value; 'json' outputs the token with metadata. (text)"
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: -U
            description: Rotate personal access token. Use @me for the current user.
        args:
          name: token-name|token-id
    options:
      - name: -h
        description: Show help for this command.
      - name: -R
        description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
