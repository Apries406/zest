          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        args:
          name: stack-name
          isOptional: true
      - name: sync
        description: Sync and submit progress on a stacked diff. (EXPERIMENTAL)
        options:
          - name: -a
            description: Assign merge request to people by their `usernames`. Multiple usernames can be comma-separated or specified by repeating the flag.
          - name: -h
            description: Show help for this command.
          - name: -l
            description: Add label by `name`. Multiple labels can be comma-separated or specified by repeating the flag.
          - name: --no-verify
            description: Bypass the pre-push hook. (See githooks(5) for more information.)
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: --reviewer
            description: Request review from users by their `usernames`. Multiple usernames can be comma-separated or specified by repeating the flag.
          - name: --skip-mr-creation
            description: Skip creating merge requests for branches that don't have one yet.
          - name: --update-base
            description: Rebase the stack onto the latest version of the base branch.
    options:
      - name: -h
        description: Show help for this command.
      - name: -R
        description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
  - name: todo
