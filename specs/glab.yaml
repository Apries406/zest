          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: list
        description: Lists all entries in the stack. (EXPERIMENTAL)
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: move
        description: Moves to any selected entry in the stack. (EXPERIMENTAL)
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: next
        description: Moves to the next diff in the stack. (EXPERIMENTAL)
        options:
          - name: -h
