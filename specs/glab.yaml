  - name: stack
    description: Create, manage, and work with stacked diffs. (EXPERIMENTAL)
    subcommands:
      - name: amend
        description: Save more changes to a stacked diff. (EXPERIMENTAL)
        options:
          - name: -a
            description: Automatically stage modified and deleted tracked files.
          - name: -d
            description: A description of the change.
          - name: -h
            description: Show help for this command.
          - name: -m
            description: Alias for the description flag.
          - name: --no-verify
            description: Bypass the pre-commit and commit-msg hooks of git-commit(1).
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: --reword
            description: Only update the commit message without staging any files.
      - name: create
        description: Create a new stacked diff. (EXPERIMENTAL)
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: delete
        description: Delete a stack. (EXPERIMENTAL)
        args:
          name: <stack-name
          isOptional: true
      - name: first
        description: Moves to the first diff in the stack. (EXPERIMENTAL)
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: infer
