          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: prev
        description: Moves to the previous diff in the stack. (EXPERIMENTAL)
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: reorder
        description: Reorder a stack of diffs. (EXPERIMENTAL)
        options:
          - name: --abort
            description: Abort a reorder and restore original branch state.
          - name: --continue
            description: Continue a reorder after resolving conflicts.
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: save
        description: Save your progress within a stacked diff. (EXPERIMENTAL)
        options:
          - name: -a
            description: Automatically stage modified and deleted tracked files.
          - name: -d
            description: Description of the change.
          - name: -h
            description: Show help for this command.
          - name: -m
            description: Alias for the description flag.
          - name: --no-verify
            description: Bypass the pre-commit and commit-msg hooks of git-commit(1).
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: switch
        description: Switch between stacks. (EXPERIMENTAL)
        options:
          - name: -h
