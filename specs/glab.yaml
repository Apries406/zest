        description: Run Pip through the GitLab Dependency Firewall. (EXPERIMENTAL)
        args:
          name: pip args
      - name: pipenv
        description: Run Pipenv through the GitLab Dependency Firewall. (EXPERIMENTAL)
        args:
          name: pipenv args
      - name: pnpm
        description: Run pnpm through the GitLab Dependency Firewall. (EXPERIMENTAL)
        args:
          name: pnpm args
      - name: poetry
        description: Run Poetry through the GitLab Dependency Firewall. (EXPERIMENTAL)
        args:
          name: poetry args
      - name: twine
        description: Run Twine through the GitLab Dependency Firewall. (EXPERIMENTAL)
        args:
          name: twine args
      - name: uv
        description: Run uv through the GitLab Dependency Firewall. (EXPERIMENTAL)
        args:
          name: uv args
      - name: yarn
        description: Run Yarn through the GitLab Dependency Firewall. (EXPERIMENTAL)
        args:
          name: yarn args
    options:
