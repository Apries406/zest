# Imported from a Fig spec. You can edit this file; see docs/adding-a-command.md.
name: glab
subcommands:
  - name: alias
    description: Create, list, and delete aliases.
    subcommands:
      - name: delete
        description: Delete an alias.
        args:
          name: alias name
      - name: list
        description: List aliases.
        options:
          - name: -h
            description: Show help for this command.
      - name: set
        description: Set an alias for a longer command.
        options:
          - name: -h
            description: Show help for this command.
          - name: -s
            description: Declare an alias to be passed through a shell interpreter.
        args:
          name: alias name
    options:
      - name: -h
        description: Show help for this command.
  - name: api
    description: Make an authenticated request to the GitLab API.
    options:
      - name: -F
        description: Add a parameter of inferred type. Using this flag changes the default HTTP method to POST.
      - name: --form
        description: Add a multipart form field. To upload a file, prefix the value with @ followed by the file path. To read from standard input, use @- (at most once). Using this flag changes the default HTTP method to POST.
      - name: -H
        description: Add an additional HTTP request header.
      - name: -h
        description: Show help for this command.
      - name: --hostname
        description: The GitLab hostname for the request. Defaults to gitlab.com, or the authenticated host in the current Git directory.
      - name: -i
        description: Include HTTP response headers in the output.
      - name: --input
        description: The file to use as the body for the HTTP request.
      - name: -X
        description: The HTTP method for the request. (GET)
      - name: --output
        description: "Format output as: json, ndjson. (json)"
      - name: --paginate
        description: Make additional HTTP requests to fetch all pages of results.
      - name: -f
        description: Add a string parameter.
      - name: --silent
        description: Do not print the response body.
    args:
      name: endpoint
  - name: artifact-registry
    description: Authenticate with GitLab Artifact Registry. (EXPERIMENTAL)
    subcommands:
      - name: get-token
        description: Get a short-lived access token for the GitLab Artifact Registry. (EXPERIMENTAL)
        options:
          - name: --duration
            description: How long the token should remain valid. Must be between 1s and 12h0m0s. (15m0s)
          - name: -h
            description: Show help for this command.
          - name: --hostname
            description: Gitlab hostname to request the token from. Defaults to the configured GitLab instance.
          - name: --jq
            description: Filter JSON output with a jq expression.
          - name: -F
            description: "Format output as: text, json. (text)"
      - name: login
        description: Authenticate a package manager against the GitLab Artifact Registry. (EXPERIMENTAL)
      - name: status
        description: Check your access to the GitLab Artifact Registry. (EXPERIMENTAL)
        options:
          - name: -h
            description: Show help for this command.
          - name: --hostname
            description: Gitlab hostname to check. Defaults to the configured GitLab instance.
          - name: --jq
            description: Filter JSON output with a jq expression.
          - name: -F
            description: "Format output as: text, json. (text)"
    options:
      - name: -h
        description: Show help for this command.
  - name: attestation
    description: Manage software attestations. (EXPERIMENTAL)
    subcommands:
      - name: verify
        description: Verify the provenance of a specific artifact or file. (EXPERIMENTAL)
        options:
          - name: -h
            description: Show help for this command.
        args:
          - name: project-id
          - name: artifact-path
    options:
      - name: -h
        description: Show help for this command.
  - name: auth
    description: Manage authentication for glab.
    subcommands:
      - name: configure-docker
        description: Register glab as a Docker credential helper.
        options:
          - name: -h
            description: Show help for this command.
      - name: docker-helper
        description: A Docker credential helper for GitLab container and artifact registries.
        options:
          - name: -h
            description: Show help for this command.
      - name: dpop-gen
        description: Generate a DPoP (demonstrating-proof-of-possession) proof JWT. (EXPERIMENTAL)
        options:
          - name: -h
            description: Show help for this command.
          - name: --hostname
            description: The hostname of the GitLab instance to authenticate with. (gitlab.com)
          - name: --pat
            description: Personal access token (PAT) to generate a DPoP proof for. Defaults to the token set with 'glab auth login'.
          - name: -p
            description: Location of the private SSH key on the local system.
      - name: login
        description: Authenticate with a GitLab instance.
      - name: logout
        description: Log out from a GitLab instance.
      - name: status
        description: View authentication status.
        options:
          - name: -a
            description: Check the authentication status of all configured instances.
          - name: -h
            description: Show help for this command.
          - name: --hostname
            description: Check the authentication status of a specific instance.
          - name: -t
            description: Display the authentication token.
    options:
      - name: -h
        description: Show help for this command.
  - name: changelog
    description: Generate changelogs from your project's commit history.
    subcommands:
      - name: generate
        description: Generate a changelog for the current project.
        options:
          - name: --config-file
            description: Path to the changelog configuration file in the project's Git repository. Defaults to '.gitlab/changelog_config.yml'.
          - name: --date
            description: Date and time of the release, in ISO 8601 format (2016-03-11T03:45:40Z). Defaults to the current time.
          - name: --from
            description: Start of the range of commits to use when generating the changelog, as a SHA. This commit is not included in the range.
          - name: -h
            description: Show help for this command.
          - name: --to
            description: End of the range of commits to use when generating the changelog, as a SHA. This commit is included in the range. Defaults to the HEAD of the project's default branch.
          - name: --trailer
            description: The Git trailer to use to include commits. Defaults to 'Changelog'.
          - name: -v
            description: Version to generate the changelog for. Must follow semantic versioning. Defaults to the version detected by 'git describe'.
    options:
      - name: -h
        description: Show help for this command.
  - name: check-update
    description: Check for the latest glab version.
    options:
      - name: -h
        description: Show help for this command.
  - name: ci
    description: Work with GitLab CI/CD pipelines and jobs.
    subcommands:
      - name: artifact
        description: Download all artifacts from the last pipeline.
        options:
          - name: -h
            description: Show help for this command.
          - name: -p
            description: Path to download the artifact files. (./)
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        args:
          - name: refName
          - name: jobName
      - name: cancel
        description: Cancel a running pipeline or job.
        subcommands:
          - name: job
            description: Cancel CI/CD jobs.
            args:
              - name: id
              - name: <id
                isOptional: true
          - name: pipeline
            description: Cancel CI/CD pipelines.
            args:
              - name: id
              - name: <id
                isOptional: true
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: config
        description: View and inspect GitLab CI/CD configuration.
        subcommands:
          - name: compile
            description: View the merged CI/CD configuration.
            args:
              name: <path
              isOptional: true
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: delete
        description: Delete CI/CD pipelines.
        args:
          name: id
      - name: get
        description: Get the details of a CI/CD pipeline.
        options:
          - name: -b
            description: Get the pipeline for a branch. Defaults to the current branch.
          - name: -h
            description: Show help for this command.
          - name: --jq
            description: Filter JSON output with a jq expression.
          - name: --merge-request
            description: Show the pipeline for the given merge request <iid>.
          - name: -F
            description: "Format output. Options: text, json. (text)"
          - name: -p
            description: Get the pipeline with the given <id>.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: -s
            description: Show only jobs in the given state. Passed through to the API's scope parameter.
          - name: -d
            description: Show extended job information.
          - name: --with-variables
            description: Show variables in pipeline. Requires the Maintainer role.
      - name: lint
        description: Check if your `.gitlab-ci.yml` file is valid.
        options:
          - name: --dry-run
            description: Run pipeline creation simulation.
          - name: -h
            description: Show help for this command.
          - name: --include-jobs
            description: Include the list of jobs that would exist in a static check or pipeline simulation.
          - name: --ref
            description: When '--dry-run' is true, sets the branch or tag context for validating the CI/CD YAML configuration.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: list
        description: List CI/CD pipelines.
        options:
          - name: -h
            description: Show help for this command.
          - name: --jq
            description: Filter JSON output with a jq expression.
          - name: -n
            description: Return only pipelines with the given name.
          - name: -o
            description: "Order pipelines by this field. Options: id, status, ref, updated_at, user_id. (id)"
          - name: -F
            description: "Format output. Options: text, json. (text)"
          - name: -p
            description: Page number. (1)
          - name: -P
            description: Number of items to list per page. Defaults to the GitLab API default (20).
          - name: -r
            description: Return only pipelines for the given ref.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: --scope
            description: "Return only pipelines with the given scope. Options: running, pending, finished, branches, tags."
          - name: --sha
            description: Return only pipelines with the given SHA.
          - name: --sort
            description: "Sort direction for '--order': asc or desc. (desc)"
          - name: --source
            description: "Return only pipelines triggered by the given source. For the full list, see https://docs.gitlab.com/ci/jobs/job_rules/#ci_pipeline_source-predefined-variable. Commonly used options: merge_request_event, parent_pipeline, pipeline, push, trigger."
          - name: -s
            description: "Filter pipelines by status. Options: running, pending, success, failed, canceled, skipped, created, manual, waiting_for_resource, preparing, scheduled."
          - name: -a
            description: Return only pipelines updated after the specified date. Expected in ISO 8601 format (2019-03-15T08:00:00Z).
          - name: -b
            description: Return only pipelines updated before the specified date. Expected in ISO 8601 format (2019-03-15T08:00:00Z).
          - name: -u
            description: Return only pipelines triggered by the given username.
          - name: -y
            description: Return only pipelines with invalid configurations.
      - name: retry
        description: Retry a CI/CD job.
        options:
          - name: -b
            description: The branch to search for the job. Defaults to the current branch.
          - name: -h
            description: Show help for this command.
          - name: -p
            description: The pipeline ID to search for the job.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        args:
          name: <job-id | job-name
          isOptional: true
      - name: run
        description: Create a new CI/CD pipeline.
        options:
          - name: -b
            description: Create pipeline on branch or reference <string>.
          - name: -h
            description: Show help for this command.
          - name: -i
            description: Pass inputs to pipeline in format '<key>:<value>'. Cannot be used for merge request pipelines. See documentation for examples.
          - name: --mr
            description: Run merge request pipeline instead of branch pipeline.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: --variables
            description: Pass variables to the pipeline in the format <key>:<value>. Cannot be used for MR pipelines.
          - name: --variables-env
            description: Pass variables to the pipeline in the format <key>:<value>. Cannot be used for MR pipelines.
          - name: --variables-file
            description: Pass file contents as a file variable to the pipeline in the format <key>:<filename>. Cannot be used for MR pipelines.
          - name: -f
            description: Json file with variables for pipeline execution. Expects array of hashes, each with at least 'key' and 'value'. Cannot be used for MR pipelines.
          - name: -w
            description: Open pipeline in a browser. Uses default browser, or browser specified in BROWSER environment variable.
      - name: run-trig
        description: Run a CI/CD pipeline trigger.
        options:
          - name: -b
            description: Create pipeline on branch or reference <string>.
          - name: -h
            description: Show help for this command.
          - name: -i
            description: Pass inputs to pipeline in format '<key>:<value>'. Cannot be used for merge request pipelines. See documentation for examples.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: -t
            description: Pipeline trigger token. Can be omitted only if the 'CI_JOB_TOKEN' environment variable is set.
          - name: --variables
            description: Pass variables to pipeline in the format <key>:<value>. Multiple variables can be comma-separated or specified by repeating the flag.
      - name: status
        description: View CI/CD pipeline status.
        options:
          - name: -b
            description: Check pipeline status for a branch. Defaults to the current branch.
          - name: -c
            description: Show status in compact format.
          - name: -h
            description: Show help for this command.
          - name: --jq
            description: Filter JSON output with a jq expression.
          - name: -l
            description: Show status in real time until the pipeline ends.
          - name: -F
            description: "Format output as: text, json. Note: JSON output is not compatible with --live, --wait, or --compact flags. (text)"
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: -w
            description: Wait to return until the pipeline is finished, and provide output without a prompt.
      - name: trace
        description: Trace a CI/CD job log in real time.
        options:
          - name: -b
            description: The branch to search for the job. Defaults to the current branch.
          - name: -h
            description: Show help for this command.
          - name: -p
            description: The pipeline ID to search for the job.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        args:
          - name: <job-id
            isOptional: true
          - name: job-name
      - name: trigger
        description: Trigger a manual CI/CD job.
        options:
          - name: -b
            description: The branch to search for the job. Defaults to the current branch.
          - name: -h
            description: Show help for this command.
          - name: -p
            description: The pipeline ID to search for the job.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        args:
          name: <job-id | job-name
          isOptional: true
      - name: view
        description: View, run, retry, and cancel CI/CD pipeline jobs.
        options:
          - name: -b
            description: Check pipeline status for a branch or tag. Defaults to the current branch.
          - name: -h
            description: Show help for this command.
          - name: -p
            description: Check pipeline status for a specific pipeline ID.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: -w
            description: Open pipeline in a browser. Uses the default browser, or the browser specified in the BROWSER environment variable.
        args:
          name: <branch | tag
          isOptional: true
    options:
      - name: -h
        description: Show help for this command.
      - name: -R
        description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
  - name: cluster
    description: Manage GitLab Agents for Kubernetes and their clusters.
    subcommands:
      - name: agent
        description: Manage GitLab Agents for Kubernetes.
        subcommands:
          - name: bootstrap
            description: Bootstrap a GitLab Agent for Kubernetes in a project.
            args:
              name: agent-name
          - name: check-manifest-usage
            description: Find agents using deprecated GitOps manifest settings. (EXPERIMENTAL)
          - name: get-token
            description: Create a personal access token for a GitLab Agent for Kubernetes.
          - name: list
            description: List GitLab Agents for Kubernetes in a project.
          - name: token
            description: Manage GitLab Agents for Kubernetes tokens.
          - name: token-cache
            description: Manage cached GitLab Agent tokens.
          - name: update-kubeconfig
            description: Update your kubeconfig for use with a GitLab Agent for Kubernetes.
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: graph
        description: Query the Kubernetes object graph using the GitLab Agent for Kubernetes. (EXPERIMENTAL)
        options:
          - name: -a
            description: The numeric agent ID to connect to.
          - name: --apps
            description: Watch deployments, replicasets, daemonsets, and statefulsets in the apps/v1 group.
          - name: --batch
            description: Watch jobs and cronjobs in the batch/v1 group.
          - name: --cluster-rbac
            description: Watch clusterroles and clusterrolebindings in the rbac.authorization.k8s.io/v1 group.
          - name: --core
            description: Watch pods, secrets, configmaps, and serviceaccounts in the core/v1 group.
          - name: --crd
            description: Watch customresourcedefinitions in the apiextensions.k8s.io/v1 group.
          - name: -h
            description: Show help for this command.
          - name: --ignore-arc-direction
            description: Ignore arc direction when evaluating root connectivity. Requires GitLab and agent version 18.3 or later.
          - name: --listen-addr
            description: Address to listen on. (localhost:0)
          - name: --listen-net
            description: Network on which to listen for connections. (tcp)
          - name: --log-watch-request
            description: Log watch request to stdout. Helpful for debugging.
          - name: -n
            description: Namespaces to watch. If not specified, all namespaces are watched with label and field selectors filtering.
          - name: --ns-expression
            description: Cel expression to select namespaces. Evaluated before a namespace is watched and on any updates for the namespace object.
          - name: --ns-field-selector
            description: Field selector to select namespaces.
          - name: --ns-label-selector
            description: Label selector to select namespaces.
          - name: --rbac
            description: Watch roles and rolebindings in the rbac.authorization.k8s.io/v1 group.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          - name: -r
            description: Resources to watch. You can see the list of resources your cluster supports by running 'kubectl api-resources'.
          - name: --root-expression
            description: Cel expression to select root objects. Requires GitLab and agent version 18.3 or later.
          - name: --stdin
            description: Read watch request from standard input.
    options:
      - name: -h
        description: Show help for this command.
      - name: -R
        description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
  - name: completion
    description: Generate shell completion scripts.
    options:
      - name: -h
        description: Show help for this command.
      - name: --no-desc
        description: Do not include shell completion description.
      - name: -s
        description: "Shell type: bash, zsh, fish, powershell. (bash)"
  - name: config
    description: Manage glab settings.
    subcommands:
      - name: edit
        description: Opens the glab configuration file.
        options:
          - name: -h
            description: Show help for this command.
          - name: -l
            description: Open '.git/glab-cli/config.yml' file instead of the global '~/.config/glab-cli/config.yml' file.
      - name: get
        description: Prints the value of a given configuration key.
        options:
          - name: -g
            description: Read from global config file (~/.config/glab-cli/config.yml). (default checks 'Environment variables → Local → Global')
          - name: -h
            description: Show help for this command.
          - name: --host
            description: Get per-host setting.
        args:
          name: key
      - name: path
        description: Print the location of the global configuration file.
        options:
          - name: --dir
            description: Print the configuration directory instead of the configuration file.
          - name: -h
            description: Show help for this command.
      - name: set
        description: Updates configuration with the value of a given key.
        options:
          - name: -g
            description: Write to global '~/.config/glab-cli/config.yml' file rather than the repository's '.git/glab-cli/config.yml' file.
          - name: -h
            description: Show help for this command.
          - name: --host
            description: Set per-host setting.
        args:
          - name: key
          - name: value
    options:
      - name: -g
        description: Use global config file.
      - name: -h
        description: Show help for this command.
  - name: container-registry
    description: Work with GitLab container registries.
    subcommands:
      - name: repository
        description: Manage container registry repositories.
        subcommands:
          - name: delete
            description: Delete a container registry repository.
            args:
              name: repository-id
          - name: list
            description: List container registry repositories.
          - name: view
            description: View a container registry repository.
            args:
              name: repository-id
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: tag
        description: Manage container registry tags.
        subcommands:
          - name: delete
            description: Delete container registry tags.
            args:
              - name: repository-id
              - name: <tag-name
                isOptional: true
          - name: list
            description: List container registry repository tags.
            args:
              name: repository-id
          - name: view
            description: View a container registry tag.
            args:
              - name: repository-id
              - name: tag-name
        options:
          - name: -h
            description: Show help for this command.
          - name: -R
            description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    options:
      - name: -h
        description: Show help for this command.
      - name: -R
        description: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
