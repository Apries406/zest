# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: chsh
description: Change your login shell
options:
  - name:
      - -s
      - --shell
    description: Specify login shell
    args:
      name: shell
      generators:
        script:
          - chsh
          - -l
        js:
          postProcess: 0
  - name:
      - -l
      - --list-shells
    description: Print list of shells and exit
  - name:
      - -u
      - -h
      - --help
    description: Print help message and exit
  - name:
      - -v
      - --version
    description: Print version and exit
args:
  name: username
  description: Target user
  isOptional: true
