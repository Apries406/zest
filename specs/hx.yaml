# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: hx
description: A post-modern text editor
options:
  - name:
      - -h
      - --help
    description: Show help
  - name: --tutor
    description: Open the tutorial
  - name: --health
    description: Check for errors in editor setup
    args:
      name: language
      isOptional: true
  - name: -v
    description: Increases logging verbosity
    isRepeatable: true
  - name:
      - -g
      - --grammar
    description: Fetch or build tree-sitter grammars
    args:
      name: action
      suggestions:
        - name: fetch
          icon: fig://icon?type=command
        - name: build
          icon: fig://icon?type=command
  - name:
      - -V
      - --version
    description: Print version information
args:
  name: files
  isVariadic: true
  template:
    - filepaths
    - folders
parserDirectives:
  flagsArePosixNoncompliant: true
