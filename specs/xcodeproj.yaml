# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: xcodeproj
description: Xcodeproj lets you create and modify Xcode projects
subcommands:
  - name: config-dump
    description: Dumps the build settings of all project targets for all configurations in directories named by the target in the given output directory
    args:
      - name: PROJECT
        isOptional: true
        generators:
          template: folders
          js:
            filterTemplateSuggestions: 0
      - name: OUTPUT
        isOptional: true
        template: folders
  - name: project-diff
    description: Shows the difference between two projects
    options:
      - name: --ignore
        description: A key to ignore in the comparison. Can be specified multiple times
        args:
          name: KEY
        isRepeatable: true
        requiresSeparator: true
    args:
      - name: PROJECT1
        generators:
          template: folders
          js:
            filterTemplateSuggestions: 0
      - name: PROJECT2
        generators:
          template: folders
          js:
            filterTemplateSuggestions: 0
  - name: show
    description: Shows an overview of a project in a YAML representation
    options:
      - name: --format
        description: YAML output format
        args:
          name: FORMAT
          suggestions:
            - hash
            - tree_hash
            - raw
        requiresSeparator: true
    args:
      name: PROJECT
      isOptional: true
      generators:
        template: folders
        js:
          filterTemplateSuggestions: 0
  - name: sort
    description: Sorts the given project
    options:
      - name: --group-option
        description: The position of the groups when sorting. If no option is specified sorting will interleave groups and files
        args:
          name: POSITION
          suggestions:
            - above
            - below
        requiresSeparator: true
    args:
      name: PROJECT
      isOptional: true
      generators:
        template: folders
        js:
          filterTemplateSuggestions: 0
  - name: target-diff
    description: Shows the difference between two targets
    options:
      - name: --project
        description: The Xcode project document to use
        args:
          name: PATH
          generators:
            template: folders
            js:
              filterTemplateSuggestions: 0
    args:
      - name: TARGET1
      - name: TARGET2
options:
  - name: --verbose
    description: Show more debugging information
    icon: 🔊
    isPersistent: true
  - name: --version
    description: Show the version of the tool
  - name: --no-ansi
    description: Show output without ANSI codes
    isPersistent: true
  - name: --help
    description: Show help banner of specified command
    isPersistent: true
