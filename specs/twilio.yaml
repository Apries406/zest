# Imported from withfig/autocomplete (MIT). You can edit this file; see docs/adding-a-command.md.
name: twilio
description: Manage your Twilio resources from your terminal
subcommands:
  - name: autocomplete
    description: Display autocomplete installation instructions
    hidden: true
    options:
      - name:
          - -r
          - --refresh-cache
        description: Refresh cache (ignores displaying instructions)
    args:
      name: shell
      description: Shell type
      suggestions:
        - name: bash
          icon: fig://icon?type=string
        - name: zsh
          icon: fig://icon?type=string
  - name: config:list
    description: List Twilio CLI configurations
    hidden: true
    options:
      - name: -l
        args:
          name: level
          description: Level of logging messages
          suggestions:
            - name: debug
              icon: fig://icon?type=string
            - name: info
              icon: fig://icon?type=string
            - name: warn
              icon: fig://icon?type=string
            - name: error
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: info
      - name: -o
        description: Format of command output
        args:
          name: format
          suggestions:
            - name: columns
              icon: fig://icon?type=string
            - name: json
              icon: fig://icon?type=string
            - name: tsv
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: columns
      - name: --silent
        description: Suppress output and logs. This is a shorthand for "-l none -o none"
  - name: config:set
    description: Update Twilio CLI configurations
    hidden: true
    options:
      - name: -l
        args:
          name: level
          description: Level of logging messages
          suggestions:
            - name: debug
              icon: fig://icon?type=string
            - name: info
              icon: fig://icon?type=string
            - name: warn
              icon: fig://icon?type=string
            - name: error
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: info
      - name: -o
        description: Format of command output
        args:
          name: format
          suggestions:
            - name: columns
              icon: fig://icon?type=string
            - name: json
              icon: fig://icon?type=string
            - name: tsv
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: columns
      - name: --silent
        description: Suppress output and logs. This is a shorthand for "-l none -o none"
      - name:
          - -e
          - --edge
        description: Sets an Edge configuration
      - name: --require-profile-input
        exclusiveOn:
          - --no-require-profile-input
      - name: --no-require-profile-input
        exclusiveOn:
          - --require-profile-input
  - name: debugger:logs:list
    description: Show a list of log events generated for the account
    hidden: true
  - name: email:send
    description: Sends emails to single or multiple recipients
    hidden: true
    options:
      - name: -l
        args:
          name: level
          description: Level of logging messages
          suggestions:
            - name: debug
              icon: fig://icon?type=string
            - name: info
              icon: fig://icon?type=string
            - name: warn
              icon: fig://icon?type=string
            - name: error
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: info
      - name: -o
        description: Format of command output
        args:
          name: format
          suggestions:
            - name: columns
              icon: fig://icon?type=string
            - name: json
              icon: fig://icon?type=string
            - name: tsv
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: columns
      - name: --silent
        description: Suppress output and logs. This is a shorthand for "-l none -o none"
      - name: --attachment
        description: Path for the file that you want to attach
        args:
          name: attachment
          template: filepaths
      - name: --from
        description: Email address of the sender
        args:
          name: from
      - name: --no-attachment
        description: Do not include or prompt for an attachment
      - name: --subject
        description: The subject line for an email
        args:
          name: subject
      - name: --text
        description: Text to send within the email body
        args:
          name: text
      - name: --to
        description: Email address of recipient (comma-separated)
        args:
          name: to
  - name: email:set
    description: Sets a default sending email address and subject line
    hidden: true
    options:
      - name: -l
        args:
          name: level
          description: Level of logging messages
          suggestions:
            - name: debug
              icon: fig://icon?type=string
            - name: info
              icon: fig://icon?type=string
            - name: warn
              icon: fig://icon?type=string
            - name: error
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: info
      - name: -o
        description: Format of command output
        args:
          name: format
          suggestions:
            - name: columns
              icon: fig://icon?type=string
            - name: json
              icon: fig://icon?type=string
            - name: tsv
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: columns
      - name: --silent
        description: Suppress output and logs. This is a shorthand for "-l none -o none"
      - name: --from
        description: Email address of the sender
        args:
          name: from
      - name: --subject
        description: The subject line for an email
        args:
          name: subject
  - name: feedback
    description: Provide feedback to the CLI team
    hidden: true
  - name: login
    description: Create a new profile to store Twilio Account credentials and configuration
    hidden: true
    options:
      - name: -l
        args:
          name: level
          description: Level of logging messages
          suggestions:
            - name: debug
              icon: fig://icon?type=string
            - name: info
              icon: fig://icon?type=string
            - name: warn
              icon: fig://icon?type=string
            - name: error
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: info
      - name: -o
        description: Format of command output
        args:
          name: format
          suggestions:
            - name: columns
              icon: fig://icon?type=string
            - name: json
              icon: fig://icon?type=string
            - name: tsv
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: columns
      - name: --silent
        description: Suppress output and logs. This is a shorthand for "-l none -o none"
      - name:
          - -f
          - --force
        description: Force overwriting existing profile credentials
      - name:
          - -p
          - --profile
        description: Shorthand identifier for your profile
        args:
          name: profile
      - name: --auth-token
        description: Your Twilio Auth Token for your Twilio Account or Subaccount
        args:
          name: auth-token
      - name: --region
        description: Twilio region to use
        args:
          name: region
