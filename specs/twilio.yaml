        isRequired: true
      - name: --account-sid
        description: The SID of the Account requesting the AvailablePhoneNumber resources
        args:
          name: account-sid
      - name: --address-sid
        description: The SID of the Address resource we should associate with the new phone number. Some regions require addresses to meet local regulations
        args:
          name: address-sid
      - name: --api-version
        description: The API version to use for incoming calls made to the new phone number. The default is `2010-04-01`
        args:
          name: api-version
      - name: --area-code
        description: The area code of the phone numbers to read. Applies to only phone numbers in the US and Canada
        args:
          name: area-code
      - name: --beta
        description: "Whether to read phone numbers that are new to the Twilio platform. Can be: `true` or `false` and the default is `true`"
        exclusiveOn:
          - --no-beta
      - name: --no-beta
        description: "Whether to read phone numbers that are new to the Twilio platform. Can be: `true` or `false` and the default is `true`"
        exclusiveOn:
          - --beta
      - name: --bundle-sid
        description: The SID of the Bundle resource that you associate with the phone number. Some regions require a Bundle to meet local Regulations
        args:
          name: bundle-sid
      - name: --contains
        description: The pattern on which to match phone numbers. Valid characters are `*`, `0-9`, `a-z`, and `A-Z`. The `*` character matches any single digit. For examples, see Example 2 and Example 3. If specified, this value must have at least two characters
        args:
          name: contains
      - name: --distance
        description: The search radius, in miles, for a `near_` query.  Can be up to `500` and the default is `25`. Applies to only phone numbers in the US and Canada
        args:
          name: distance
      - name: --emergency-address-sid
        description: The SID of the emergency address configuration to use for emergency calling from the new phone number
        args:
          name: emergency-address-sid
      - name: --emergency-status
        description: The parameter displays if emergency calling is enabled for this number. Active numbers may place emergency calls by dialing valid emergency numbers for the country
        args:
          name: status
          suggestions:
            - name: active
              icon: fig://icon?type=string
            - name: inactive
              icon: fig://icon?type=string
      - name: --exclude-all-address-required
        description: "Whether to exclude phone numbers that require an Address. Can be: `true` or `false` and the default is `false`"
        exclusiveOn:
          - --no-exclude-all-address-required
      - name: --no-exclude-all-address-required
        description: "Whether to exclude phone numbers that require an Address. Can be: `true` or `false` and the default is `false`"
        exclusiveOn:
          - --exclude-all-address-required
      - name: --exclude-foreign-address-required
        description: "Whether to exclude phone numbers that require a foreign Address. Can be: `true` or `false` and the default is `false`"
        exclusiveOn:
          - --no-exclude-foreign-address-required
      - name: --no-exclude-foreign-address-required
        description: "Whether to exclude phone numbers that require a foreign Address. Can be: `true` or `false` and the default is `false`"
        exclusiveOn:
          - --exclude-foreign-address-required
      - name: --exclude-local-address-required
        description: "Whether to exclude phone numbers that require a local Address. Can be: `true` or `false` and the default is `false`"
        exclusiveOn:
          - --no-exclude-local-address-required
      - name: --no-exclude-local-address-required
        description: "Whether to exclude phone numbers that require a local Address. Can be: `true` or `false` and the default is `false`"
        exclusiveOn:
          - --exclude-local-address-required
      - name: --fax-enabled
        description: "Whether the phone numbers can receive faxes. Can be: `true` or `false`"
        exclusiveOn:
          - --no-fax-enabled
      - name: --no-fax-enabled
        description: "Whether the phone numbers can receive faxes. Can be: `true` or `false`"
        exclusiveOn:
          - --fax-enabled
      - name: --friendly-name
        description: A descriptive string that you created to describe the new phone number. It can be up to 64 characters long. By default, this is a formatted version of the new phone number
        args:
          name: friendly-name
      - name: --identity-sid
        description: The SID of the Identity resource that we should associate with the new phone number. Some regions require an identity to meet local regulations
        args:
          name: identity-sid
      - name: --in-lata
        description: Limit results to a specific local access and transport area (LATA). Given a phone number, search within the same LATA as that number. Applies to only phone numbers in the US and Canada
        args:
          name: in-lata
      - name: --in-locality
        description: Limit results to a particular locality or city. Given a phone number, search within the same Locality as that number
        args:
          name: in-locality
      - name: --in-postal-code
        description: Limit results to a particular postal code. Given a phone number, search within the same postal code as that number. Applies to only phone numbers in the US and Canada
        args:
          name: in-postal-code
      - name: --in-rate-center
        description: Limit results to a specific rate center, or given a phone number search within the same rate center as that number. Requires `in_lata` to be set as well. Applies to only phone numbers in the US and Canada
        args:
          name: in-rate-center
      - name: --in-region
        description: Limit results to a particular region, state, or province. Given a phone number, search within the same region as that number. Applies to only phone numbers in the US and Canada
        args:
          name: in-region
      - name: --limit
        description: The maximum number of resources to return. Use '--no-limit' to disable
        args:
          name: limit
          default: "50"
      - name: --mms-enabled
        description: "Whether the phone numbers can receive MMS messages. Can be: `true` or `false`"
        exclusiveOn:
          - --no-mms-enabled
      - name: --no-mms-enabled
