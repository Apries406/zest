              icon: fig://icon?type=string
            - name: warn
              icon: fig://icon?type=string
            - name: error
              icon: fig://icon?type=string
            - name: none
              icon: fig://icon?type=string
          default: info
      - name: -o
        description: Format of command output
        args:
          name: format
          suggestions:
            - name: columns
              icon: fig://icon?type=string
            - name: json
              icon: fig://icon?type=string
            - name: tsv
              icon: fig://icon?type=string
