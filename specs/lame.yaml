# Imported from a Fig spec. You can edit this file; see docs/adding-a-command.md.
name: lame
options:
  - name: -b
    description: set the bitrate, default 128 kbps
  - name: -h
    description: higher quality, but a little slower.
  - name: -f
    description: fast mode (lower quality)
  - name: -V
    description: quality setting for VBR.  default n=4 0=high quality,bigger files. 9.999=smaller files
  - name: --preset
    description: type must be "medium", "standard", "extreme", "insane", or a value for an average desired bitrate and depending on the value specified, appropriate quality settings will be used. "--preset help" gives more info on these
  - name: --help
    description: ID3 tagging related options
  - name: --longhelp
    description: full list of options
  - name: --license
    description: print License information
args:
  name: args
  isOptional: true
  isVariadic: true
