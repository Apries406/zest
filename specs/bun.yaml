  - name: link
    description: Run without an argument to register this package to the global package registry. Uses the name field from package.json
    icon: 📦
    options:
      - name: --save
        description: Save to package.json
        dependsOn:
          - package
    args:
      name: package
      description: Install a package from the global package registry
      isOptional: true
      generators:
        script:
          - command
          - sh
          - -c
          - find $BUN_INSTALL/install/global/node_modules -type l -o -type d -maxdepth 2 | awk -F 'node_modules/' '{print $2}'
        cache:
          ttl: 86.4
        js:
          postProcess: 18
      filterStrategy: fuzzy
