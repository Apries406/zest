          - --development
        description: Install as devDependency
        priority: 75
        isRepeatable: false
      - name: --exact
        description: Install exact version
      - name: --optional
        description: Install as optionalDependency
    args:
      name: package
      isVariadic: true
      generators:
        cache:
          ttl: 172800
        getQueryTerm: "@"
        js:
          custom: 8
          trigger: 7
      filterStrategy: fuzzy
